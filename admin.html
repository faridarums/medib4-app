<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medib4 – پنل ادمین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg-main:#080612;
  --bg-secondary:#100b1d;
  --card:rgba(22,15,37,.90);
  --card-hover:rgba(36,25,56,.96);
  --text:#f8f7ff;
  --muted:#aaa2bd;
  --border:rgba(168,85,247,.20);
  --purple:#a855f7;
  --purple-dark:#7e22ce;
  --red:#ef4444;
  --green:#22c55e;
  --shadow:0 12px 40px rgba(0,0,0,.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:"Vazirmatn",sans-serif;
  color:var(--text);
  background-color:var(--bg-main);
  background-image:radial-gradient(circle at 50% 0%, rgba(168,85,247,.15), transparent 42%);
  min-height:100vh;
}
button,input,textarea,select{font-family:inherit;color:inherit;}
button{border:0;cursor:pointer;}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 80px;}

/* login */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:32px 24px;text-align:center;}
.login-card h1{font-size:20px;margin:0 0 4px;}
.login-card p{color:var(--muted);font-size:12px;margin:0 0 20px;}
.login-card input{width:100%;height:48px;border-radius:14px;border:1px solid var(--border);background:var(--bg-secondary);padding:0 14px;font-size:14px;outline:none;margin-bottom:12px;}
.login-card input:focus{border-color:var(--purple);}
.btn-primary{width:100%;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--purple),var(--purple-dark));color:#fff;font-size:14px;font-weight:700;}
.err{color:var(--red);font-size:12px;min-height:16px;margin-top:8px;}

/* generic dialog modal (replaces native alert/confirm/prompt) */
.dialog-overlay{
  position:fixed;inset:0;z-index:1000;
  display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);
  padding:20px;
}
.dialog-overlay.show{display:flex;}
.dialog-box{
  width:100%;max-width:340px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  padding:26px 22px;
  text-align:center;
}
.dialog-box h3{font-size:16px;margin:0 0 8px;}
.dialog-box p{color:var(--muted);font-size:12.5px;line-height:1.9;margin:0 0 14px;white-space:pre-line;}
.dialog-box input,.dialog-box textarea{
  width:100%;border-radius:13px;border:1px solid var(--border);
  background:var(--bg-secondary);color:var(--text);
  padding:11px 13px;font-size:13px;outline:none;margin-bottom:14px;
  font-family:inherit;
}
.dialog-box textarea{min-height:80px;resize:vertical;}
.dialog-box input:focus,.dialog-box textarea:focus{border-color:var(--purple);}
.dialog-actions{display:flex;gap:10px;}
.dialog-actions button{flex:1;height:44px;border-radius:13px;font-size:13px;font-weight:700;}
.dialog-cancel{background:var(--bg-secondary);border:1px solid var(--border);color:var(--muted);}
.dialog-confirm{background:linear-gradient(145deg,var(--purple),var(--purple-dark));color:#fff;}
.dialog-confirm.danger{background:linear-gradient(145deg,#ef4444,#b91c1c);}

/* header/tabs */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.header h1{font-size:20px;margin:0;}
.logout-btn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;color:var(--muted);font-size:12px;}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;}
.tab{white-space:nowrap;padding:10px 16px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;}
.tab.active{background:linear-gradient(145deg,rgba(168,85,247,.35),rgba(126,34,206,.25));color:#fff;border-color:rgba(168,85,247,.5);}

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}
.card h3{margin:0 0 12px;font-size:14px;color:var(--purple);}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.row input,.row select,.row textarea{flex:1;min-width:140px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--bg-secondary);padding:0 12px;font-size:13px;outline:none;}
.row textarea{height:70px;padding:10px 12px;resize:vertical;}
.row input:focus,.row select:focus,.row textarea:focus{border-color:var(--purple);}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.opt-row input[type=radio]{accent-color:var(--purple);width:18px;height:18px;flex:none;}
.opt-row input[type=text]{flex:1;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg-secondary);padding:0 10px;font-size:13px;outline:none;}

.btn{padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;}
.btn-add{background:linear-gradient(145deg,var(--purple),var(--purple-dark));color:#fff;}
.btn-del{background:rgba(239,68,68,.14);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.btn-save{background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}

.item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px;border-radius:14px;background:var(--bg-secondary);border:1px solid var(--border);margin-bottom:8px;}
.item-main{flex:1;min-width:0;}
.item-title{font-size:13px;font-weight:600;margin-bottom:3px;}
.item-sub{font-size:11px;color:var(--muted);}
.item-actions{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card-hover);border:1px solid var(--border);color:var(--muted);}
.icon-btn.danger{color:var(--red);}
.icon-btn svg{width:16px;height:16px;}

.empty{text-align:center;color:var(--muted);font-size:12px;padding:24px 0;}
.muted-small{color:var(--muted);font-size:11px;}
.q-options-view{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.9;}
.q-options-view .correct{color:var(--green);font-weight:700;}
</style>
</head>
<body>

<div id="app"></div>

<div id="dialogOverlay" class="dialog-overlay">
  <div class="dialog-box">
    <h3 id="dialogTitle"></h3>
    <p id="dialogMessage"></p>
    <div id="dialogInputWrap" style="display:none;">
      <input id="dialogInput" type="text" onkeydown="if(event.key==='Enter')resolveDialog(true)">
    </div>
    <div class="dialog-actions">
      <button id="dialogCancelBtn" class="dialog-cancel" onclick="resolveDialog(false)">انصراف</button>
      <button id="dialogConfirmBtn" class="dialog-confirm" onclick="resolveDialog(true)">تایید</button>
    </div>
  </div>
</div>

<script>
/* =====================================================
CONFIG
===================================================== */
let API_BASE = "https://medib4-worker.tmpl8uxxmvxq2d.workers.dev";

let adminPassword = sessionStorage.getItem("medib4_admin_pw") || "";
let adminRole = sessionStorage.getItem("medib4_admin_role") || "";
let currentTab = "courses";
let coursesCache = [];
let questionsCache = [];
let selectedCourseFilter = "";
let bulkMode = "text";

/* =====================================================
API HELPER
===================================================== */
async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Password": adminPassword,
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || ("خطا: " + res.status));
  }
  return res.json();
}

/* =====================================================
GENERIC DIALOG (replaces native alert/confirm/prompt)
===================================================== */
let dialogResolver = null;

function renderDialog(opts) {
  document.getElementById("dialogTitle").textContent = opts.title;
  document.getElementById("dialogMessage").textContent = opts.message || "";
  const inputWrap = document.getElementById("dialogInputWrap");
  const input = document.getElementById("dialogInput");
  if (opts.showInput) {
    inputWrap.style.display = "block";
    input.value = opts.defaultValue || "";
  } else {
    inputWrap.style.display = "none";
  }
  const cancelBtn = document.getElementById("dialogCancelBtn");
  cancelBtn.style.display = opts.showCancel ? "block" : "none";
  const confirmBtn = document.getElementById("dialogConfirmBtn");
  confirmBtn.textContent = opts.confirmLabel || "باشه";
  confirmBtn.className = "dialog-confirm" + (opts.danger ? " danger" : "");
  document.getElementById("dialogOverlay").classList.add("show");
  if (opts.showInput) {
    setTimeout(() => { input.focus(); input.select(); }, 50);
  }
}

function resolveDialog(confirmed) {
  const inputWrap = document.getElementById("dialogInputWrap");
  const isPrompt = inputWrap.style.display !== "none";
  let result;
  if (!confirmed) {
    result = isPrompt ? null : false;
  } else if (isPrompt) {
    result = document.getElementById("dialogInput").value;
  } else {
    result = true;
  }
  document.getElementById("dialogOverlay").classList.remove("show");
  if (dialogResolver) {
    const r = dialogResolver;
    dialogResolver = null;
    r(result);
  }
}

function showAlert(message, title) {
  return new Promise((resolve) => {
    dialogResolver = resolve;
    renderDialog({ title: title || "توجه", message, showInput: false, showCancel: false, confirmLabel: "باشه" });
  });
}

function showConfirm(message, options) {
  options = options || {};
  return new Promise((resolve) => {
    dialogResolver = resolve;
    renderDialog({ title: options.title || "مطمئنی؟", message, showInput: false, showCancel: true, confirmLabel: options.confirmLabel || "تایید", danger: options.danger });
  });
}

function showPrompt(message, defaultValue, options) {
  options = options || {};
  return new Promise((resolve) => {
    dialogResolver = resolve;
    renderDialog({ title: options.title || "ویرایش", message, showInput: true, defaultValue: defaultValue || "", showCancel: true, confirmLabel: options.confirmLabel || "ذخیره" });
  });
}

/* =====================================================
LOGIN
===================================================== */
function renderLogin(err) {
  document.getElementById("app").innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <h1>پنل ادمین Medib4</h1>
        <p>برای ورود رمز عبور را وارد کنید</p>
        <input id="pwInput" type="password" placeholder="رمز عبور" autofocus>
        <button class="btn-primary" onclick="doLogin()">ورود</button>
        <div class="err">${err || ""}</div>
      </div>
    </div>
  `;
  const pwInput = document.getElementById("pwInput");
  pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
}

async function doLogin() {
  const pw = document.getElementById("pwInput").value;
  if (!pw) return renderLogin("رمز عبور را وارد کنید.");
  try {
    const res = await fetch(API_BASE + "/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "رمز عبور اشتباه است.");
    adminPassword = pw;
    adminRole = data.role || "";
    sessionStorage.setItem("medib4_admin_pw", pw);
    sessionStorage.setItem("medib4_admin_role", adminRole);
    await loadAll();
    renderApp();
  } catch (e) {
    renderLogin(e.message);
  }
}

function logout() {
  sessionStorage.removeItem("medib4_admin_pw");
  sessionStorage.removeItem("medib4_admin_role");
  adminPassword = "";
  adminRole = "";
  renderLogin();
}

/* =====================================================
DATA LOADING
===================================================== */
async function loadAll() {
  coursesCache = await api("/api/admin/courses");
}

/* =====================================================
APP SHELL
===================================================== */
function renderApp() {
  const tabs = [
    { id: "courses", label: "دوره‌ها" },
    { id: "questions", label: "بانک سوالات" },
    { id: "comments", label: "نظرات" },
    { id: "stats", label: "آمار سوالات" },
    { id: "reports", label: "گزارش‌ها" },
    { id: "users", label: "کاربران" },
    { id: "messages", label: "پیام‌ها" },
  ];
  if (adminRole === "primary") {
    tabs.push({ id: "settings", label: "تنظیمات" });
  }
  document.getElementById("app").innerHTML = `
    <div class="wrap">
      <div class="header">
        <h1>پنل ادمین Medib4</h1>
        <button class="logout-btn" onclick="logout()"><i data-lucide="log-out"></i> خروج</button>
      </div>
      <div class="tabs">
        ${tabs.map(t => `<button class="tab ${currentTab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join("")}
      </div>
      <div id="tabContent"></div>
    </div>
  `;
  renderTabContent();
}

function switchTab(id) {
  currentTab = id;
  renderApp();
}

async function renderTabContent() {
  const el = document.getElementById("tabContent");
  el.innerHTML = `<div class="empty">در حال بارگذاری...</div>`;
  try {
    if (currentTab === "courses") await renderCoursesTab(el);
    else if (currentTab === "questions") await renderQuestionsTab(el);
    else if (currentTab === "comments") await renderCommentsTab(el);
    else if (currentTab === "stats") await renderStatsTab(el);
    else if (currentTab === "reports") await renderReportsTab(el);
    else if (currentTab === "users") await renderUsersTab(el);
    else if (currentTab === "messages") await renderMessagesTab(el);
    else if (currentTab === "settings") await renderSettingsTab(el);
  } catch (e) {
    el.innerHTML = `<div class="card"><div class="err">${e.message}</div></div>`;
  }
  if (window.lucide) lucide.createIcons();
}

/* =====================================================
COURSES TAB
===================================================== */
async function renderCoursesTab(el) {
  coursesCache = await api("/api/admin/courses");
  el.innerHTML = `
    <div class="card">
      <h3>افزودن دوره جدید</h3>
      <div class="row">
        <input id="newCourseTitle" placeholder="عنوان دوره">
        <input id="newCourseIcon" placeholder="آیکون lucide (اختیاری، مثلاً book-open)">
      </div>
      <button class="btn btn-add" onclick="addCourse()">افزودن دوره</button>
    </div>
    <div class="card">
      <h3>لیست دوره‌ها (${coursesCache.length})</h3>
      ${coursesCache.length ? coursesCache.map(c => `
        <div class="item">
          <div class="item-main">
            <div class="item-title">${escapeHTML(c.title)}</div>
            <div class="item-sub">آیکون: ${escapeHTML(c.icon||'-')}</div>
          </div>
          <div class="item-actions">
            <button class="icon-btn" onclick="editCoursePrompt('${c.id}')"><i data-lucide="pencil"></i></button>
            <button class="icon-btn danger" onclick="deleteCourse('${c.id}')"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      `).join("") : `<div class="empty">هنوز دوره‌ای ثبت نشده.</div>`}
    </div>
  `;
}

async function addCourse() {
  const title = document.getElementById("newCourseTitle").value.trim();
  const icon = document.getElementById("newCourseIcon").value.trim();
  if (!title) return showAlert("عنوان دوره الزامی است.");
  const id = generateId("c");
  await api("/api/admin/courses", { method: "POST", body: JSON.stringify({ id, title, icon }) });
  renderTabContent();
}

async function editCoursePrompt(id) {
  const c = coursesCache.find(x => x.id === id);
  const title = await showPrompt("عنوان جدید دوره:", c.title, { title: "ویرایش دوره" });
  if (title === null) return;
  const icon = await showPrompt("آیکون جدید (lucide):", c.icon || "", { title: "ویرایش دوره" });
  if (icon === null) return;
  await api("/api/admin/courses/" + encodeURIComponent(id), { method: "PUT", body: JSON.stringify({ title, icon }) });
  renderTabContent();
}

async function deleteCourse(id) {
  const confirmed = await showConfirm("این دوره و همه سوالاتش حذف بشه؟ این عملیات قابل بازگشت نیست.", { title: "حذف دوره", confirmLabel: "حذف", danger: true });
  if (!confirmed) return;
  await api("/api/admin/courses/" + encodeURIComponent(id), { method: "DELETE" });
  renderTabContent();
}

/* =====================================================
QUESTIONS TAB
===================================================== */
async function renderQuestionsTab(el) {
  if (!coursesCache.length) coursesCache = await api("/api/admin/courses");
  const qUrl = selectedCourseFilter ? ("/api/admin/questions?course=" + encodeURIComponent(selectedCourseFilter)) : "/api/admin/questions";
  questionsCache = await api(qUrl);

  el.innerHTML = `
    <div class="card">
      <h3>فیلتر بر اساس دوره</h3>
      <div class="row">
        <select id="courseFilter" onchange="onCourseFilterChange(this.value)">
          <option value="">همه دوره‌ها</option>
          ${coursesCache.map(c => `<option value="${c.id}" ${selectedCourseFilter===c.id?'selected':''}>${escapeHTML(c.title)}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="card">
      <h3>افزودن سوال جدید</h3>
      <div class="row">
        <select id="newQCourse" onchange="onNewQCourseChange(this.value)">
          ${coursesCache.map(c => `<option value="${c.id}">${escapeHTML(c.title)}</option>`).join("")}
        </select>
      </div>
      <div class="row" id="newQGenderRow" style="display:none;">
        <select id="newQGender">
          <option value="f">خواهران</option>
          <option value="m">برادران</option>
        </select>
      </div>
      <div class="row"><textarea id="newQText" placeholder="متن سوال"></textarea></div>
      <div id="newQOptions">
        ${[0,1,2,3].map(i => `
          <div class="opt-row">
            <input type="radio" name="newQAnswer" value="${i}" ${i===0?'checked':''}>
            <input type="text" id="newQOpt${i}" placeholder="گزینه ${i+1}">
          </div>
        `).join("")}
      </div>
      <div class="row"><textarea id="newQExplanation" placeholder="توضیح پاسخ (اختیاری)"></textarea></div>
      <button class="btn btn-add" onclick="addQuestion()">افزودن سوال</button>
    </div>

    <div class="card">
      <h3>افزودن دسته‌جمعی سوالات</h3>
      <div class="row" style="margin-bottom:10px;">
        <button type="button" class="btn ${bulkMode==='text'?'btn-add':'btn-ghost'}" onclick="setBulkMode('text')" style="flex:1;">متن ساده</button>
        <button type="button" class="btn ${bulkMode==='json'?'btn-add':'btn-ghost'}" onclick="setBulkMode('json')" style="flex:1;">JSON پیشرفته</button>
      </div>
      <div class="row">
        <select id="bulkQCourse">
          ${coursesCache.map(c => `<option value="${c.id}">${escapeHTML(c.title)}</option>`).join("")}
        </select>
      </div>

      ${bulkMode === 'text' ? `
        <p class="muted-small" style="margin-bottom:10px;line-height:2;">
          هر سوال رو با یه خط خالی از سوال بعدی جدا کن. زیر سوال، گزینه‌ها رو یکی‌یکی بنویس (هر گزینه یه خط)، و جلوی گزینه‌ی درست یه ستاره <b>*</b> بذار. اگه خواستی، یه خط با «توضیح:» هم آخرش اضافه کن.
        </p>
        <div class="row">
          <textarea id="bulkQText" style="min-height:220px;font-size:12px;line-height:2;" placeholder="پایتخت ایران کجاست؟
اصفهان
*تهران
شیراز
مشهد
توضیح: تهران پایتخت ایرانه

آب از چند اتم تشکیل شده؟
یک
*سه
چهار
پنج"></textarea>
        </div>
      ` : `
        <p class="muted-small" style="margin-bottom:12px;">یه لیست از سوالات رو به‌صورت JSON بچسبون.</p>
        <div class="row">
          <textarea id="bulkQJson" style="min-height:160px;font-family:monospace;direction:ltr;text-align:left;font-size:11px;" placeholder='[
  {
    "question": "متن سوال؟",
    "options": ["گزینه ۱", "گزینه ۲", "گزینه ۳", "گزینه ۴"],
    "answer": 0,
    "explanation": "توضیح اختیاری"
  }
]'></textarea>
        </div>
        <p class="muted-small" style="margin-bottom:12px;">answer یعنی شماره‌ی گزینه‌ی درست، از صفر شروع می‌شه (۰ = گزینه اول).</p>
      `}

      <button class="btn btn-add" onclick="addQuestionsBulk()">افزودن همه</button>
    </div>

    <div class="card">
      <h3>لیست سوالات (${questionsCache.length})</h3>
      ${questionsCache.length ? questionsCache.map(q => `
        <div class="item">
          <div class="item-main">
            <div class="item-title">${escapeHTML(q.question)}</div>
            <div class="item-sub">دوره: ${escapeHTML(q.course_id)}${q.gender?(' — گروه: '+(q.gender==='f'?'خواهران':'برادران')):''}</div>
            <div class="q-options-view">
              ${q.options.map((o,i) => `${i===q.answer?'<span class="correct">✓ </span>':'• '}${escapeHTML(o)}`).join("<br>")}
            </div>
          </div>
          <div class="item-actions">
            <button class="icon-btn" onclick="editQuestion('${q.id}')"><i data-lucide="pencil"></i></button>
            <button class="icon-btn danger" onclick="deleteQuestion('${q.id}')"><i data-lucide="trash-2"></i></button>

function parseBulkPlainText(raw) {
  const blocks = raw
    .split(/\n\s*\n+/)
    .map(b => b.trim())
    .filter(Boolean);

  const questions = [];
  const errors = [];

  blocks.forEach((block, blockIndex) => {
    const rawLines = block.split("\n").map(l => l.trim()).filter(Boolean);
    if (!rawLines.length) return;

    const question = rawLines[0].replace(/^(\d+[\.\)]|سوال\s*\d*[:\.]?)\s*/, "").trim();
    const optionLines = [];
    let explanation = null;

    rawLines.slice(1).forEach(line => {
      const explMatch = line.match(/^توضیح\s*[:：]\s*(.+)$/);
      if (explMatch) {
        explanation = explMatch[1].trim();
        return;
      }
      optionLines.push(line);
    });

    if (!question || optionLines.length < 2) {
      errors.push("سوال شماره " + (blockIndex + 1) + ": متن سوال یا گزینه‌های کافی پیدا نشد.");
      return;
    }

    let answer = 0;
    const options = optionLines.map((line, i) => {
      let opt = line;
      let isCorrect = false;
      if (opt.startsWith("*")) {
        isCorrect = true;
        opt = opt.slice(1).trim();
      }
      opt = opt.replace(/^(الف|ب|ج|د|[A-Da-d]|[۱۲۳۴]|[1-4])[\)\.\-]\s*/, "").trim();
      if (isCorrect) answer = i;
      return opt;
    });

    if (!optionLines.some(l => l.startsWith("*"))) {
      errors.push("سوال شماره " + (blockIndex + 1) + ": هیچ گزینه‌ای با * علامت‌گذاری نشده (گزینه اول به‌عنوان پیش‌فرض درست در نظر گرفته شد).");
    }

    questions.push({ question, options, answer, explanation });
  });

  return { questions, errors };
}

async function addQuestionsBulk() {
  const course_id = document.getElementById("bulkQCourse").value;
  let list;

  if (bulkMode === "text") {
    const raw = document.getElementById("bulkQText").value.trim();
    if (!raw) return showAlert("متن سوال‌ها رو وارد کن.");
    const { questions, errors } = parseBulkPlainText(raw);
    if (!questions.length) {
      return showAlert("هیچ سوال معتبری پیدا نشد. مطمئن شو بین هر سوال یه خط خالی گذاشتی.");
    }
    if (errors.length) {
      const proceed = await showConfirm(
        errors.join("\n") + "\n\nبا این حال " + questions.length + " سوال قابل استخراج بود. ادامه بدم؟",
        { title: "چند نکته", confirmLabel: "بله، ادامه بده" }
      );
      if (!proceed) return;
    }
    list = questions;
  } else {
    const raw = document.getElementById("bulkQJson").value.trim();
    if (!raw) return showAlert("لیست سوالات رو به‌صورت JSON بچسبون.");
    try {
      list = JSON.parse(raw);
    } catch (e) {
      return showAlert("متن وارد شده JSON معتبر نیست:\n" + e.message);
    }
    if (!Array.isArray(list) || !list.length) {
      return showAlert("باید یه آرایه از سوالات باشه، مثل چیزی که توی مثال بالا نشون داده شده.");
    }
    for (const q of list) {
      if (!q.question || !Array.isArray(q.options) || q.options.length < 2) {
        return showAlert("هر سوال باید question و حداقل ۲ گزینه داشته باشه.");
      }
    }
  }

  const confirmed = await showConfirm(list.length + " سوال به این دوره اضافه بشه؟", { title: "افزودن دسته‌جمعی", confirmLabel: "اضافه کن" });
  if (!confirmed) return;
  try {
    const res = await api("/api/admin/questions/bulk", { method: "POST", body: JSON.stringify({ course_id, questions: list }) });
    const textEl = document.getElementById("bulkQText");
    const jsonEl = document.getElementById("bulkQJson");
    if (textEl) textEl.value = "";
    if (jsonEl) jsonEl.value = "";
    await showAlert(res.count + " سوال با موفقیت اضافه شد.", "انجام شد");
    renderTabContent();
  } catch (e) {
    await showAlert(e.message, "خطا");
  }
}

    const res = await fetch(API_BASE + "/api/admin/backups/" + encodeURIComponent(key), {
      headers: { "X-Admin-Password": adminPassword },
    });
    if (!res.ok) throw new Error("دانلود ناموفق بود.");
    const text = await res.text();
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = key + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    await showAlert(e.message, "خطا");
  }
}

async function setSecondaryAdmin() {
  const pw = document.getElementById("secondaryAdminPw").value;
  if (!pw || pw.length < 6) return await showAlert("رمز باید حداقل ۶ کاراکتر باشد.", "خطا");
  await api("/api/admin/settings/secondary-admin", { method: "POST", body: JSON.stringify({ password: pw }) });
  renderTabContent();
}

async function removeSecondaryAdmin() {
  const confirmed = await showConfirm("دسترسی ادمین دستیار حذف بشه؟", { title: "حذف دسترسی", confirmLabel: "حذف", danger: true });
  if (!confirmed) return;
  api("/api/admin/settings/secondary-admin", { method: "DELETE" }).then(() => renderTabContent());
}

/* =====================================================
HELPERS
===================================================== */
function escapeHTML(text) {
  return String(text ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function generateId(prefix) {
  return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* =====================================================
INIT
===================================================== */
if (adminPassword) {
  loadAll().then(renderApp).catch(() => renderLogin());
} else {
  renderLogin();
}
