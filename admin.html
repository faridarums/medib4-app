<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medib4 – پنل ادمین</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  --bg-main:#080612;
  --bg-secondary:#100b1d;
  --card:rgba(22,15,37,.90);
  --card-hover:rgba(36,25,56,.96);
  --text:#f8f7ff;
  --muted:#aaa2bd;
  --border:rgba(168,85,247,.20);
  --purple:#a855f7;
  --purple-dark:#7e22ce;
  --red:#ef4444;
  --green:#22c55e;
  --shadow:0 12px 40px rgba(0,0,0,.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;min-height:100%;}
body{
  font-family:"Vazirmatn",sans-serif;
  color:var(--text);
  background-color:var(--bg-main);
  background-image:radial-gradient(circle at 50% 0%, rgba(168,85,247,.15), transparent 42%);
  min-height:100vh;
}
button,input,textarea,select{font-family:inherit;color:inherit;}
button{border:0;cursor:pointer;}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 80px;}

/* login */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:32px 24px;text-align:center;}
.login-card h1{font-size:20px;margin:0 0 4px;}
.login-card p{color:var(--muted);font-size:12px;margin:0 0 20px;}
.login-card input{width:100%;height:48px;border-radius:14px;border:1px solid var(--border);background:var(--bg-secondary);padding:0 14px;font-size:14px;outline:none;margin-bottom:12px;}
.login-card input:focus{border-color:var(--purple);}
.btn-primary{width:100%;height:48px;border-radius:14px;background:linear-gradient(145deg,var(--purple),var(--purple-dark));color:#fff;font-size:14px;font-weight:700;}
.err{color:var(--red);font-size:12px;min-height:16px;margin-top:8px;}

/* header/tabs */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.header h1{font-size:20px;margin:0;}
.logout-btn{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 12px;color:var(--muted);font-size:12px;}
.tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px;}
.tab{white-space:nowrap;padding:10px 16px;border-radius:14px;background:var(--card);border:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600;}
.tab.active{background:linear-gradient(145deg,rgba(168,85,247,.35),rgba(126,34,206,.25));color:#fff;border-color:rgba(168,85,247,.5);}

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);padding:18px;margin-bottom:14px;}
.card h3{margin:0 0 12px;font-size:14px;color:var(--purple);}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
.row input,.row select,.row textarea{flex:1;min-width:140px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--bg-secondary);padding:0 12px;font-size:13px;outline:none;}
.row textarea{height:70px;padding:10px 12px;resize:vertical;}
.row input:focus,.row select:focus,.row textarea:focus{border-color:var(--purple);}
.opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.opt-row input[type=radio]{accent-color:var(--purple);width:18px;height:18px;flex:none;}
.opt-row input[type=text]{flex:1;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg-secondary);padding:0 10px;font-size:13px;outline:none;}

.btn{padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;}
.btn-add{background:linear-gradient(145deg,var(--purple),var(--purple-dark));color:#fff;}
.btn-del{background:rgba(239,68,68,.14);color:var(--red);border:1px solid rgba(239,68,68,.3);}
.btn-save{background:rgba(34,197,94,.14);color:var(--green);border:1px solid rgba(34,197,94,.3);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted);}

.item{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px;border-radius:14px;background:var(--bg-secondary);border:1px solid var(--border);margin-bottom:8px;}
.item-main{flex:1;min-width:0;}
.item-title{font-size:13px;font-weight:600;margin-bottom:3px;}
.item-sub{font-size:11px;color:var(--muted);}
.item-actions{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--card-hover);border:1px solid var(--border);color:var(--muted);}
.icon-btn.danger{color:var(--red);}
.icon-btn svg{width:16px;height:16px;}

.empty{text-align:center;color:var(--muted);font-size:12px;padding:24px 0;}
.muted-small{color:var(--muted);font-size:11px;}
.q-options-view{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.9;}
.q-options-view .correct{color:var(--green);font-weight:700;}
</style>
</head>
<body>

<div id="app"></div>

<script>
/* =====================================================
CONFIG
===================================================== */
let API_BASE = "https://medib4-worker.tmpl8uxxmvxq2d.workers.dev";

let adminPassword = sessionStorage.getItem("medib4_admin_pw") || "";
let adminRole = sessionStorage.getItem("medib4_admin_role") || "";
let currentTab = "courses";
let coursesCache = [];
let questionsCache = [];
let selectedCourseFilter = "";

/* =====================================================
API HELPER
===================================================== */
async function api(path, opts = {}) {
  const res = await fetch(API_BASE + path, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      "X-Admin-Password": adminPassword,
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || ("خطا: " + res.status));
  }
  return res.json();
}

/* =====================================================
LOGIN
===================================================== */
function renderLogin(err) {
  document.getElementById("app").innerHTML = `
    <div class="login-screen">
      <div class="login-card">
        <h1>پنل ادمین Medib4</h1>
        <p>برای ورود رمز عبور را وارد کنید</p>
        <input id="pwInput" type="password" placeholder="رمز عبور" autofocus>
        <button class="btn-primary" onclick="doLogin()">ورود</button>
        <div class="err">${err || ""}</div>
      </div>
    </div>
  `;
  const pwInput = document.getElementById("pwInput");
  pwInput.addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
}

async function doLogin() {
  const pw = document.getElementById("pwInput").value;
  if (!pw) return renderLogin("رمز عبور را وارد کنید.");
  try {
    const res = await fetch(API_BASE + "/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pw }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "رمز عبور اشتباه است.");
    adminPassword = pw;
    adminRole = data.role || "";
    sessionStorage.setItem("medib4_admin_pw", pw);
    sessionStorage.setItem("medib4_admin_role", adminRole);
    await loadAll();
    renderApp();
  } catch (e) {
    renderLogin(e.message);
  }
}

function logout() {
  sessionStorage.removeItem("medib4_admin_pw");
  sessionStorage.removeItem("medib4_admin_role");
  adminPassword = "";
  adminRole = "";
  renderLogin();
}

/* =====================================================
DATA LOADING
===================================================== */
async function loadAll() {
  coursesCache = await api("/api/admin/courses");
}

/* =====================================================
APP SHELL
===================================================== */
function renderApp() {
  const tabs = [
    { id: "courses", label: "دوره‌ها" },
    { id: "questions", label: "بانک سوالات" },
    { id: "comments", label: "نظرات" },
    { id: "stats", label: "آمار سوالات" },
  ];
  if (adminRole === "primary") {
    tabs.push({ id: "users", label: "کاربران" });
    tabs.push({ id: "messages", label: "پیام‌ها" });
    tabs.push({ id: "settings", label: "تنظیمات" });
  }
  document.getElementById("app").innerHTML = `
    <div class="wrap">
      <div class="header">
        <h1>پنل ادمین Medib4</h1>
        <button class="logout-btn" onclick="logout()"><i data-lucide="log-out"></i> خروج</button>
      </div>
      <div class="tabs">
        ${tabs.map(t => `<button class="tab ${currentTab===t.id?'active':''}" onclick="switchTab('${t.id}')">${t.label}</button>`).join("")}
      </div>
      <div id="tabContent"></div>
    </div>
  `;
  renderTabContent();
}

function switchTab(id) {
  currentTab = id;
  renderApp();
}

async function renderTabContent() {
  const el = document.getElementById("tabContent");
  el.innerHTML = `<div class="empty">در حال بارگذاری...</div>`;
  try {
    if (currentTab === "courses") await renderCoursesTab(el);
    else if (currentTab === "questions") await renderQuestionsTab(el);
    else if (currentTab === "comments") await renderCommentsTab(el);
    else if (currentTab === "stats") await renderStatsTab(el);
    else if (currentTab === "users") await renderUsersTab(el);
    else if (currentTab === "messages") await renderMessagesTab(el);
    else if (currentTab === "settings") await renderSettingsTab(el);
  } catch (e) {
    el.innerHTML = `<div class="card"><div class="err">${e.message}</div></div>`;
  }
  if (window.lucide) lucide.createIcons();
}

/* =====================================================
COURSES TAB
===================================================== */
async function renderCoursesTab(el) {
  coursesCache = await api("/api/admin/courses");
  el.innerHTML = `
    <div class="card">
      <h3>افزودن دوره جدید</h3>
      <div class="row">
        <input id="newCourseTitle" placeholder="عنوان دوره">
        <input id="newCourseIcon" placeholder="آیکون lucide (اختیاری، مثلاً book-open)">
      </div>
      <button class="btn btn-add" onclick="addCourse()">افزودن دوره</button>
    </div>
    <div class="card">
      <h3>لیست دوره‌ها (${coursesCache.length})</h3>
      ${coursesCache.length ? coursesCache.map(c => `
        <div class="item">
          <div class="item-main">
            <div class="item-title">${escapeHTML(c.title)}</div>
            <div class="item-sub">آیکون: ${escapeHTML(c.icon||'-')}</div>
          </div>
          <div class="item-actions">
            <button class="icon-btn" onclick="editCoursePrompt('${c.id}')"><i data-lucide="pencil"></i></button>
            <button class="icon-btn danger" onclick="deleteCourse('${c.id}')"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      `).join("") : `<div class="empty">هنوز دوره‌ای ثبت نشده.</div>`}
    </div>
  `;
}

async function addCourse() {
  const title = document.getElementById("newCourseTitle").value.trim();
  const icon = document.getElementById("newCourseIcon").value.trim();
  if (!title) return alert("عنوان دوره الزامی است.");
  const id = generateId("c");
  await api("/api/admin/courses", { method: "POST", body: JSON.stringify({ id, title, icon }) });
  renderTabContent();
}

function editCoursePrompt(id) {
  const c = coursesCache.find(x => x.id === id);
  const title = prompt("عنوان جدید دوره:", c.title);
  if (title === null) return;
  const icon = prompt("آیکون جدید (lucide):", c.icon || "");
  api("/api/admin/courses/" + encodeURIComponent(id), { method: "PUT", body: JSON.stringify({ title, icon }) })
    .then(() => renderTabContent());
}

function deleteCourse(id) {
  if (!confirm("این دوره و همه سوالاتش حذف بشه؟ این عملیات قابل بازگشت نیست.")) return;
  api("/api/admin/courses/" + encodeURIComponent(id), { method: "DELETE" }).then(() => renderTabContent());
}

/* =====================================================
QUESTIONS TAB
===================================================== */
async function renderQuestionsTab(el) {
  if (!coursesCache.length) coursesCache = await api("/api/admin/courses");
  const qUrl = selectedCourseFilter ? ("/api/admin/questions?course=" + encodeURIComponent(selectedCourseFilter)) : "/api/admin/questions";
  questionsCache = await api(qUrl);

  el.innerHTML = `
    <div class="card">
      <h3>فیلتر بر اساس دوره</h3>
      <div class="row">
        <select id="courseFilter" onchange="onCourseFilterChange(this.value)">
          <option value="">همه دوره‌ها</option>
          ${coursesCache.map(c => `<option value="${c.id}" ${selectedCourseFilter===c.id?'selected':''}>${escapeHTML(c.title)}</option>`).join("")}
        </select>
      </div>
    </div>

    <div class="card">
      <h3>افزودن سوال جدید</h3>
      <div class="row">
        <select id="newQCourse" onchange="onNewQCourseChange(this.value)">
          ${coursesCache.map(c => `<option value="${c.id}">${escapeHTML(c.title)}</option>`).join("")}
        </select>
      </div>
      <div class="row" id="newQGenderRow" style="display:none;">
        <select id="newQGender">
          <option value="f">خواهران</option>
          <option value="m">برادران</option>
        </select>
      </div>
      <div class="row"><textarea id="newQText" placeholder="متن سوال"></textarea></div>
      <div id="newQOptions">
        ${[0,1,2,3].map(i => `
          <div class="opt-row">
            <input type="radio" name="newQAnswer" value="${i}" ${i===0?'checked':''}>
            <input type="text" id="newQOpt${i}" placeholder="گزینه ${i+1}">
          </div>
        `).join("")}
      </div>
      <div class="row"><textarea id="newQExplanation" placeholder="توضیح پاسخ (اختیاری)"></textarea></div>
      <button class="btn btn-add" onclick="addQuestion()">افزودن سوال</button>
    </div>

    <div class="card">
      <h3>لیست سوالات (${questionsCache.length})</h3>
      ${questionsCache.length ? questionsCache.map(q => `
        <div class="item">
          <div class="item-main">
            <div class="item-title">${escapeHTML(q.question)}</div>
            <div class="item-sub">دوره: ${escapeHTML(q.course_id)}${q.gender?(' — گروه: '+(q.gender==='f'?'خواهران':'برادران')):''}</div>
            <div class="q-options-view">
              ${q.options.map((o,i) => `${i===q.answer?'<span class="correct">✓ </span>':'• '}${escapeHTML(o)}`).join("<br>")}
            </div>
          </div>
          <div class="item-actions">
            <button class="icon-btn" onclick="editQuestion('${q.id}')"><i data-lucide="pencil"></i></button>
            <button class="icon-btn danger" onclick="deleteQuestion('${q.id}')"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      `).join("") : `<div class="empty">سوالی پیدا نشد.</div>`}
    </div>
  `;
  onNewQCourseChange(document.getElementById("newQCourse").value);
}

const GENDER_SPLIT_COURSES = ["islamic_thought_1", "family_f"];

function onNewQCourseChange(courseId) {
  const row = document.getElementById("newQGenderRow");
  if (!row) return;
  row.style.display = GENDER_SPLIT_COURSES.includes(courseId) ? "flex" : "none";
}

function onCourseFilterChange(v) {
  selectedCourseFilter = v;
  renderTabContent();
}

async function addQuestion() {
  const course_id = document.getElementById("newQCourse").value;
  const question = document.getElementById("newQText").value.trim();
  const options = [0,1,2,3].map(i => document.getElementById("newQOpt"+i).value.trim());
  const answer = Number(document.querySelector('input[name=newQAnswer]:checked').value);
  const explanation = document.getElementById("newQExplanation").value.trim();
  if (!question || options.some(o => !o)) return alert("متن سوال و هر ۴ گزینه الزامی هستند.");
  const gender = GENDER_SPLIT_COURSES.includes(course_id)
    ? document.getElementById("newQGender").value
    : null;
  const id = generateId("q");
  await api("/api/admin/questions", { method: "POST", body: JSON.stringify({ id, course_id, question, options, answer, explanation, gender }) });
  renderTabContent();
}

function editQuestion(id) {
  const q = questionsCache.find(x => x.id === id);
  const question = prompt("متن سوال:", q.question);
  if (question === null) return;
  const options = q.options.map((o, i) => prompt("گزینه " + (i+1) + ":", o));
  if (options.some(o => o === null)) return;
  const answerStr = prompt("شماره گزینه صحیح (۱ تا ۴):", String(q.answer + 1));
  if (answerStr === null) return;
  const answer = Math.min(3, Math.max(0, Number(answerStr) - 1));
  const explanation = prompt("توضیح پاسخ (اختیاری):", q.explanation || "");
  let gender = q.gender || null;
  if (GENDER_SPLIT_COURSES.includes(q.course_id)) {
    const g = prompt("گروه (f = خواهران, m = برادران):", gender || "f");
    if (g === null) return;
    gender = (g === "m") ? "m" : "f";
  }
  api("/api/admin/questions/" + encodeURIComponent(id), { method: "PUT", body: JSON.stringify({ question, options, answer, explanation, gender }) })
    .then(() => renderTabContent());
}

function deleteQuestion(id) {
  if (!confirm("این سوال حذف بشه؟")) return;
  api("/api/admin/questions/" + encodeURIComponent(id), { method: "DELETE" }).then(() => renderTabContent());
}

/* =====================================================
COMMENTS TAB
===================================================== */
async function renderCommentsTab(el) {
  const comments = await api("/api/admin/comments");
  el.innerHTML = `
    <div class="card">
      <h3>آخرین نظرات (${comments.length})</h3>
      ${comments.length ? comments.map(c => `
        <div class="item">
          <div class="item-main">
            <div class="item-title">${escapeHTML(c.name || "کاربر")}</div>
            <div class="item-sub">سوال: ${escapeHTML(c.question_id)} — ${new Date(c.created_at).toLocaleString('fa-IR')}</div>
            <div class="muted-small" style="margin-top:6px;color:var(--text);">${escapeHTML(c.text)}</div>
          </div>
          <div class="item-actions">
            <button class="icon-btn danger" onclick="deleteComment(${c.id})"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      `).join("") : `<div class="empty">هنوز نظری ثبت نشده.</div>`}
    </div>
  `;
}

/* =====================================================
STATS TAB (most-missed questions)
===================================================== */
async function renderStatsTab(el) {
  if (!coursesCache.length) coursesCache = await api("/api/admin/courses");
  const stats = await api("/api/admin/question-stats");
  el.innerHTML = `
    <div class="card">
      <h3>سوالاتی که بیشتر غلط جواب داده می‌شن</h3>
      <p class="muted-small" style="margin-bottom:12px;">فقط سوالاتی که حداقل یک بار جواب داده شدن نشون داده می‌شن.</p>
      ${stats.length ? stats.map(s => {
        const total = s.correct_n + s.wrong_n;
        const wrongPct = total ? Math.round((s.wrong_n / total) * 100) : 0;
        const course = coursesCache.find(c => c.id === s.course_id);
        return `
          <div class="item">
            <div class="item-main">
              <div class="item-title">${escapeHTML(s.question)}</div>
              <div class="item-sub">دوره: ${escapeHTML(course ? course.title : s.course_id)} — ${s.wrong_n} غلط از ${total} پاسخ</div>
            </div>
            <div style="flex-shrink:0;font-weight:800;font-size:13px;color:${wrongPct >= 50 ? 'var(--red)' : 'var(--muted)'};">
              ${wrongPct}٪
            </div>
          </div>
        `;
      }).join("") : `<div class="empty">هنوز کسی سوالی جواب نداده.</div>`}
    </div>
  `;
}

function deleteComment(id) {
  if (!confirm("این نظر حذف بشه؟")) return;
  api("/api/admin/comments/" + id, { method: "DELETE" }).then(() => renderTabContent());
}

/* =====================================================
USERS TAB
===================================================== */
async function renderUsersTab(el) {
  const users = await api("/api/admin/users");
  el.innerHTML = `
    <div class="card">
      <h3>کاربران و امتیازها (${users.length})</h3>
      ${users.length ? users.map(u => `
        <div class="item">
          <div class="item-main">
            <div class="item-title">${escapeHTML(u.name || "بدون نام")}</div>
            <div class="item-sub">امتیاز کل: ${u.points} — درست امروز: ${u.correct_today} — غلط امروز: ${u.wrong_today} — کل درست: ${u.correct_total} — کل غلط: ${u.wrong_total}${!u.has_password ? ' — <span style="color:#ef4444;">بدون رمز</span>' : ''}</div>
            ${(() => {
              let hist = [];
              try { hist = JSON.parse(u.name_history || "[]"); } catch {}
              return hist.length
                ? `<div class="muted-small" style="margin-top:4px;">نام‌های قبلی: ${hist.map(h => escapeHTML(h.name)).join("، ")}</div>`
                : "";
            })()}
          </div>
          <div class="item-actions">
            <button class="icon-btn" onclick="editUser('${u.id}')"><i data-lucide="pencil"></i></button>
            <button class="icon-btn" onclick="resetUserPassword('${u.id}')" title="بازنشانی رمز"><i data-lucide="key-round"></i></button>
            <button class="icon-btn danger" onclick="deleteUser('${u.id}')"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      `).join("") : `<div class="empty">هنوز کاربری ثبت نشده.</div>`}
    </div>
  `;
}

function editUser(id) {
  api("/api/admin/users").then(users => {
    const u = users.find(x => x.id === id);
    const name = prompt("نام کاربر:", u.name || "");
    if (name === null) return;
    const pointsStr = prompt("امتیاز کل:", String(u.points));
    if (pointsStr === null) return;
    api("/api/admin/users/" + encodeURIComponent(id), { method: "PUT", body: JSON.stringify({ name, points: Number(pointsStr) || 0 }) })
      .then(() => renderTabContent());
  });
}

function deleteUser(id) {
  if (!confirm("این کاربر حذف بشه؟")) return;
  api("/api/admin/users/" + encodeURIComponent(id), { method: "DELETE" }).then(() => renderTabContent());
}

async function resetUserPassword(id) {
  const newPw = prompt("رمز جدید برای این کاربر (حداقل ۶ کاراکتر):");
  if (newPw === null) return;
  if (newPw.length < 6) return alert("رمز باید حداقل ۶ کاراکتر باشد.");
  if (!confirm("رمز قبلی این کاربر باطل می‌شه و این رمز جدید جاش میاد. مطمئنی؟")) return;
  try {
    const data = await api("/api/admin/users/" + encodeURIComponent(id) + "/reset-password", { method: "POST", body: JSON.stringify({ new_password: newPw }) });
    alert("رمز جدید تنظیم شد.\nکد بازیابی جدید این کاربر: " + data.recovery_code + "\n\nاین رمز و کد رو از طریق «پیام‌ها» به کاربر بگو.");
  } catch (e) {
    alert(e.message);
  }
}

/* =====================================================
MESSAGES TAB
===================================================== */
let currentThreadUserId = null;

async function renderMessagesTab(el) {
  if (currentThreadUserId) {
    return renderThreadView(el);
  }
  const [threads, allUsers] = await Promise.all([
    api("/api/admin/messages"),
    api("/api/admin/users-lite"),
  ]);
  const threadUserIds = new Set(threads.map(t => t.user_id));
  const usersWithoutThread = allUsers.filter(u => !threadUserIds.has(u.id));
  el.innerHTML = `
    <div class="card">
      <h3>شروع گفتگوی جدید</h3>
      ${usersWithoutThread.length ? `
        <div class="row">
          <select id="newThreadUser">
            ${usersWithoutThread.map(u => `<option value="${u.id}">${escapeHTML(u.name)}</option>`).join("")}
          </select>
        </div>
        <button class="btn btn-add" onclick="startNewThread()">شروع گفتگو</button>
      ` : `<div class="empty">کاربر دیگه‌ای برای شروع گفتگوی جدید نیست.</div>`}
    </div>
    <div class="card">
      <h3>گفتگوها (${threads.length})</h3>
      ${threads.length ? threads.map(t => `
        <div class="item" style="cursor:pointer;" onclick="openThread('${t.user_id}')">
          <div class="item-main">
            <div class="item-title">${escapeHTML(t.name || "کاربر بدون نام")}</div>
            <div class="item-sub">${t.last_sender === 'admin' ? 'شما: ' : ''}${escapeHTML((t.last_text||'').slice(0,60))}</div>
          </div>
          <div class="item-actions">
            <button class="icon-btn"><i data-lucide="chevron-left"></i></button>
          </div>
        </div>
      `).join("") : `<div class="empty">هنوز پیامی ثبت نشده.</div>`}
    </div>
  `;
}

function startNewThread() {
  const sel = document.getElementById("newThreadUser");
  if (!sel || !sel.value) return;
  currentThreadUserId = sel.value;
  renderTabContent();
}

function openThread(userId) {
  currentThreadUserId = userId;
  renderTabContent();
}

function closeThread() {
  currentThreadUserId = null;
  renderTabContent();
}

async function renderThreadView(el) {
  const messages = await api("/api/admin/messages/" + encodeURIComponent(currentThreadUserId));
  el.innerHTML = `
    <div class="card">
      <button class="btn btn-ghost" style="margin-bottom:12px;" onclick="closeThread()">‹ بازگشت به لیست گفتگوها</button>
      <div id="threadMessages" style="display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow-y:auto;margin-bottom:12px;">
        ${messages.length ? messages.map(m => `
          <div style="
            align-self:${m.sender === 'admin' ? 'flex-start' : 'flex-end'};
            background:${m.sender === 'admin' ? 'rgba(168,85,247,.18)' : 'var(--bg-secondary)'};
            border:1px solid var(--border);
            border-radius:14px;
            padding:8px 12px;
            max-width:80%;
            font-size:13px;
          ">
            ${escapeHTML(m.text)}
          </div>
        `).join("") : `<div class="empty">پیامی وجود ندارد.</div>`}
      </div>
      <div class="row">
        <textarea id="threadReplyInput" placeholder="پاسخ خود را بنویسید..."></textarea>
      </div>
      <button class="btn btn-add" onclick="sendThreadReply()">ارسال پاسخ</button>
    </div>
  `;
  const box = document.getElementById("threadMessages");
  if (box) box.scrollTop = box.scrollHeight;
}

async function sendThreadReply() {
  const input = document.getElementById("threadReplyInput");
  const text = input.value.trim();
  if (!text) return;
  await api("/api/admin/messages", { method: "POST", body: JSON.stringify({ user_id: currentThreadUserId, text }) });
  renderTabContent();
}

/* =====================================================
SETTINGS TAB (primary admin only)
===================================================== */
async function renderSettingsTab(el) {
  const [info, backups] = await Promise.all([
    api("/api/admin/settings/secondary-admin"),
    api("/api/admin/backups"),
  ]);
  el.innerHTML = `
    <div class="card">
      <h3>ادمین دستیار</h3>
      <p class="muted-small" style="margin-bottom:12px;">می‌تونی حداکثر یک نفر دیگه (به‌جز خودت) رو به پنل ادمین دسترسی بدی.</p>
      ${info.isSet ? `
        <div class="item" style="margin-bottom:12px;">
          <div class="item-main">
            <div class="item-title">یک ادمین دستیار فعال است</div>
          </div>
          <div class="item-actions">
            <button class="icon-btn danger" onclick="removeSecondaryAdmin()"><i data-lucide="trash-2"></i></button>
          </div>
        </div>
      ` : `<div class="empty" style="margin-bottom:12px;">فعلاً ادمین دستیاری تعریف نشده.</div>`}
      <div class="row">
        <input id="secondaryAdminPw" type="password" placeholder="${info.isSet ? 'رمز جدید برای جایگزینی' : 'رمز عبور ادمین دستیار'}">
      </div>
      <button class="btn btn-add" onclick="setSecondaryAdmin()">${info.isSet ? 'تغییر رمز' : 'فعال‌سازی'}</button>
    </div>

    <div class="card">
      <h3>بکاپ‌ها</h3>
      <p class="muted-small" style="margin-bottom:12px;">هر یکشنبه خودکار بکاپ گرفته می‌شه؛ آخرین ۸ نسخه نگه داشته می‌شن.</p>
      <button class="btn btn-add" style="margin-bottom:12px;" onclick="runBackupNow()">گرفتن بکاپ همین الان</button>
      ${backups.length ? backups.map(b => `
        <div class="item">
          <div class="item-main">
            <div class="item-title">${new Date(b.created_at).toLocaleString('fa-IR')}</div>
            <div class="item-sub">${b.size ? Math.round(b.size / 1024) + ' کیلوبایت' : ''}</div>
          </div>
          <div class="item-actions">
            <button class="icon-btn" onclick="downloadBackup('${b.key}')"><i data-lucide="download"></i></button>
          </div>
        </div>
      `).join("") : `<div class="empty">هنوز بکاپی گرفته نشده.</div>`}
    </div>
  `;
}

async function runBackupNow() {
  try {
    await api("/api/admin/backups/run-now", { method: "POST" });
    renderTabContent();
  } catch (e) {
    alert(e.message);
  }
}

async function downloadBackup(key) {
  try {
    const res = await fetch(API_BASE + "/api/admin/backups/" + encodeURIComponent(key), {
      headers: { "X-Admin-Password": adminPassword },
    });
    if (!res.ok) throw new Error("دانلود ناموفق بود.");
    const text = await res.text();
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = key + ".json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert(e.message);
  }
}

async function setSecondaryAdmin() {
  const pw = document.getElementById("secondaryAdminPw").value;
  if (!pw || pw.length < 6) return alert("رمز باید حداقل ۶ کاراکتر باشد.");
  await api("/api/admin/settings/secondary-admin", { method: "POST", body: JSON.stringify({ password: pw }) });
  renderTabContent();
}

function removeSecondaryAdmin() {
  if (!confirm("دسترسی ادمین دستیار حذف بشه؟")) return;
  api("/api/admin/settings/secondary-admin", { method: "DELETE" }).then(() => renderTabContent());
}

/* =====================================================
HELPERS
===================================================== */
function escapeHTML(text) {
  return String(text ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

function generateId(prefix) {
  return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* =====================================================
INIT
===================================================== */
if (adminPassword) {
  loadAll().then(renderApp).catch(() => renderLogin());
} else {
  renderLogin();
}
</script>
