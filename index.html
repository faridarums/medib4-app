<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080612">

<title>Medib4</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
    href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

/* =====================================================
ROOT
===================================================== */

:root{
    --bg-main:#080612;
    --bg-secondary:#100b1d;

    --card:rgba(22,15,37,.90);
    --card-hover:rgba(36,25,56,.96);

    --text:#f8f7ff;
    --muted:#aaa2bd;

    --border:rgba(168,85,247,.20);

    --purple:#a855f7;
    --purple-dark:#7e22ce;

    --lime:#84cc16;
    --cyan:#06b6d4;
    --pink:#ec4899;
    --orange:#f97316;
    --red:#ef4444;
    --green:#22c55e;
    --yellow:#eab308;
    --blue:#38bdf8;
    --teal:#14b8a6;
    --indigo:#6366f1;

    --page-grid-color:rgba(168,85,247,.09);

    --shadow:
        0 12px 40px rgba(0,0,0,.30);
}

/* =====================================================
LIGHT MODE
===================================================== */

body.light{
    --bg-main:#f3f0f8;
    --bg-secondary:#ebe7f1;

    --card:#ffffff;
    --card-hover:#ffffff;

    --text:#17131f;
    --muted:#5f586b;

    --border:rgba(72,55,91,.18);

    --purple:#7e22ce;
    --purple-dark:#6b21a8;

    --lime:#4d7c0f;
    --cyan:#0369a1;
    --pink:#be185d;
    --orange:#c2410c;
    --red:#dc2626;
    --green:#15803d;
    --yellow:#a16207;
    --blue:#0369a1;
    --teal:#0f766e;
    --indigo:#4f46e5;

    --page-grid-color:rgba(92,72,120,.075);

    --shadow:
        0 10px 30px rgba(58,43,76,.12);
}

/* =====================================================
RESET
===================================================== */

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:"Vazirmatn",sans-serif;
    color:var(--text);
    background-color:var(--bg-main);

    background-image:
        linear-gradient(
            to right,
            var(--page-grid-color) 1px,
            transparent 1px
        ),
        linear-gradient(
            to bottom,
            var(--page-grid-color) 1px,
            transparent 1px
        ),
        radial-gradient(
            circle at 50% 0%,
            rgba(168,85,247,.15),
            transparent 42%
        );

    background-size:
        24px 24px,
        24px 24px,
        100% 100%;

    background-attachment:fixed;

    transition:
        background-color .3s,
        color .3s;
}

body.light{
    background-image:
        linear-gradient(
            to right,
            var(--page-grid-color) 1px,
            transparent 1px
        ),
        linear-gradient(
            to bottom,
            var(--page-grid-color) 1px,
            transparent 1px
        ),
        radial-gradient(
            circle at 50% 0%,
            rgba(126,34,206,.055),
            transparent 42%
        );
}

button,
input{
    font-family:inherit;
}

button{
    border:0;
    cursor:pointer;
}

/* =====================================================
APP
===================================================== */

.app{
    width:100%;
    max-width:520px;
    min-height:100vh;
    margin:auto;

    padding:
        12px
        12px
        100px;
}

/* =====================================================
HEADER
===================================================== */

.header{
    position:sticky;
    top:10px;
    z-index:50;

    height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:8px 12px;

    border:
        1px solid
        var(--border);

    border-radius:25px;

    background:var(--card);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:var(--shadow);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:43px;
    height:43px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:transparent!important;
    border:0!important;
    box-shadow:none!important;

    color:var(--purple);

    flex-shrink:0;
}

.logo svg{
    width:31px;
    height:31px;
    stroke-width:2.2;
}

.brand-text{
    line-height:1;
}

.brand-title{
    font-family:"Lalezar",sans-serif;
    font-size:26px;
}

.brand-sub{
    margin-top:5px;
    color:var(--muted);
    font-size:9px;
}

.theme-btn{
    width:44px;
    height:44px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;
    transition:.3s;
}

body:not(.light) .theme-btn{
    color:#c084fc;

    background:
        linear-gradient(
            145deg,
            rgba(168,85,247,.22),
            rgba(91,33,182,.16)
        );

    border:
        1px solid
        rgba(192,132,252,.28);

    box-shadow:
        0 0 18px
        rgba(168,85,247,.12);
}

body.light .theme-btn{
    color:#d97706;

    background:
        linear-gradient(
            145deg,
            rgba(251,191,36,.16),
            rgba(245,158,11,.08)
        );

    border:
        1px solid
        rgba(217,119,6,.24);

    box-shadow:
        0 5px 16px
        rgba(245,158,11,.10);
}

.theme-btn svg{
    width:21px;
    height:21px;
}

/* =====================================================
SEARCH
===================================================== */

.search-box{
    position:relative;

    margin:
        18px
        2px
        15px;
}

.search-box input{
    width:100%;
    height:52px;

    padding:
        0
        48px
        0
        16px;

    outline:none;

    border:
        1px solid
        var(--border);

    border-radius:18px;

    background:var(--card);
    color:var(--text);

    font-size:12px;

    box-shadow:var(--shadow);

    caret-color:var(--purple);
}

.search-box input::placeholder{
    color:var(--muted);
    opacity:1;
}

.search-box input:focus{
    border-color:
        rgba(126,34,206,.40);

    box-shadow:
        0 0 0 3px
        rgba(126,34,206,.07),
        var(--shadow);
}

.search-icon{
    position:absolute;
    right:17px;
    top:16px;

    color:var(--muted);
}

/* =====================================================
GENERAL
===================================================== */

.screen{
    animation:
        fadeIn
        .25s
        ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:
            translateY(8px);
    }

    to{
        opacity:1;
        transform:
            translateY(0);
    }
}

.page-title{
    margin:
        20px
        4px
        15px;
}

.page-title h1{
    margin:0;
    color:var(--text);
    font-size:21px;
    font-weight:900;
}

.card{
    background:var(--card);

    border:
        1px solid
        var(--border);

    border-radius:23px;

    box-shadow:var(--shadow);
}

/* =====================================================
SEMESTER
===================================================== */

.semester-grid{
    display:grid;
    grid-template-columns:1fr;
    gap:13px;
}

.semester-card{
    min-height:150px;

    padding:22px;

    display:flex;
    align-items:center;
    gap:17px;

    position:relative;
    overflow:hidden;

    border-radius:27px;

    background:var(--card);

    border:
        1px solid
        var(--border);

    box-shadow:var(--shadow);

    cursor:pointer;

    transition:.2s;
}

.semester-card:active{
    transform:scale(.98);
}

.semester-card::after{
    content:"";

    position:absolute;

    width:120px;
    height:120px;

    left:-45px;
    bottom:-60px;

    border-radius:50%;

    background:
        rgba(168,85,247,.10);
}

.semester-icon{
    width:70px;
    height:70px;
    min-width:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:23px;

    color:#c084fc;

    background:
        linear-gradient(
            145deg,
            rgba(168,85,247,.18),
            rgba(6,182,212,.10)
        );

    border:
        1px solid
        rgba(168,85,247,.18);
}

body.light .semester-icon{
    color:#7e22ce;

    background:
        linear-gradient(
            145deg,
            rgba(126,34,206,.09),
            rgba(3,105,161,.06)
        );

    border-color:
        rgba(126,34,206,.14);
}

.semester-icon svg{
    width:36px;
    height:36px;
}

.semester-info strong{
    font-family:"Lalezar",sans-serif;
    font-size:27px;
    font-weight:400;
    color:var(--text);
}

.semester-arrow{
    margin-right:auto;
    color:var(--muted);
}

/* =====================================================
COURSES
===================================================== */

.course-grid{
    display:grid;
    grid-template-columns:
        1fr 1fr;

    gap:12px;
}

.course-card{
    min-height:160px;

    padding:
        15px
        10px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    position:relative;
    overflow:hidden;

    border-radius:25px;

    background:var(--card);

    border:
        1px solid
        var(--border);

    box-shadow:var(--shadow);

    cursor:pointer;

    transition:
        transform .18s,
        background .2s;
}

.course-card:active{
    transform:scale(.96);
}

.course-icon{
    width:64px;
    height:64px;
    min-width:64px;

    margin-bottom:11px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:20px;

    border:
        1px solid
        rgba(255,255,255,.07);
}

body.light .course-icon{
    border-color:
        rgba(72,55,91,.10);
}

.course-icon svg{
    width:35px;
    height:35px;
    stroke-width:1.8;
}

.kidney-svg,
.lungs-svg{
    width:43px!important;
    height:43px!important;

    display:block;

    fill:none;
    stroke:currentColor;

    stroke-linecap:round;
    stroke-linejoin:round;

    overflow:visible;
}

.course-card:hover .kidney-svg,
.course-card:hover .lungs-svg{
    transform:scale(1.05);

    filter:
        drop-shadow(
            0 0 6px
            currentColor
        );
}

/* =====================================================
COURSE COLORS
===================================================== */

.course-card:nth-child(1) .course-icon{
    color:#38bdf8;
    background:rgba(56,189,248,.13);
}

.course-card:nth-child(2) .course-icon{
    color:#a855f7;
    background:rgba(168,85,247,.13);
}

.course-card:nth-child(3) .course-icon{
    color:#f59e0b;
    background:rgba(245,158,11,.13);
}

.course-card:nth-child(4) .course-icon{
    color:#22c55e;
    background:rgba(34,197,94,.13);
}

.course-card:nth-child(5) .course-icon{
    color:#ec4899;
    background:rgba(236,72,153,.13);
}

.course-card:nth-child(6) .course-icon{
    color:#06b6d4;
    background:rgba(6,182,212,.13);
}

.course-card:nth-child(7) .course-icon{
    color:#f97316;
    background:rgba(249,115,22,.13);
}

.course-card:nth-child(8) .course-icon{
    color:#ef4444;
    background:rgba(239,68,68,.13);
}

.course-card:nth-child(9) .course-icon{
    color:#8b5cf6;
    background:rgba(139,92,246,.13);
}

.course-card:nth-child(10) .course-icon{
    color:#14b8a6;
    background:rgba(20,184,166,.13);
}

.course-card:nth-child(11) .course-icon{
    color:#eab308;
    background:rgba(234,179,8,.13);
}

.course-card:nth-child(12) .course-icon{
    color:#6366f1;
    background:rgba(99,102,241,.13);
}

.course-card:nth-child(13) .course-icon{
    color:#84cc16;
    background:rgba(132,204,22,.13);
}

.course-title{
    color:var(--text);

    font-size:13.5px;
    font-weight:900;
    line-height:1.8;

    padding:
        0
        4px;
}

/* =====================================================
COURSE PROGRESS — MINIMAL
===================================================== */

.course-progress{
    width:100%;
    margin-top:12px;
    padding:0 4px;
}

.course-progress-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:7px;
    direction:rtl;
}

.course-progress-count{
    color:var(--muted);
    font-size:9px;
    font-weight:700;
}

.course-progress-percent{
    color:var(--text);
    font-size:9px;
    font-weight:800;
}

.course-progress-track{
    width:100%;
    height:5px;
    overflow:hidden;
    border-radius:999px;
    background:rgba(168,85,247,.10);
}

.course-progress-fill{
    height:100%;
    min-width:0;
    border-radius:999px;
    background:linear-gradient(90deg,var(--cyan),var(--purple));
    transition:width .35s ease;
}

body.light .course-progress-track{
    background:rgba(126,34,206,.09);
}

body.light .course-progress-fill{
    background:linear-gradient(90deg,#0369a1,#7e22ce);
}

/* =====================================================
PROFILE ACTION CARDS
===================================================== */

.profile-actions{
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-top:12px;
}

.profile-actions .support-entry{
    margin:0!important;
}

.support-entry{
    position:relative;
    display:flex;
    width:100%;
    min-height:70px;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px 16px;
    margin:0;
    overflow:hidden;
    cursor:pointer;
    text-align:right;
}

.support-entry + .support-entry{
    margin-top:0;
}

.support-entry-left{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:0;
}

.support-entry-icon{
    width:38px;
    height:38px;
    flex:0 0 38px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
}

.support-entry-icon svg{
    width:18px;
    height:18px;
}

.support-entry-text{
    min-width:0;
    text-align:right;
}

.support-entry-text strong{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--text);
}

.support-entry-text span{
    display:block;
    margin-top:2px;
    font-size:10px;
    line-height:1.7;
    color:var(--muted);
}

.support-entry-arrow{
    flex:0 0 auto;
    color:var(--muted);
    display:flex;
    align-items:center;
}

.support-entry-arrow svg{
    width:17px;
    height:17px;
}

/* =====================================================
BACK
===================================================== */

.back-btn{
    display:flex;
    align-items:center;
    gap:7px;

    margin:
        18px
        3px
        14px;

    background:none;
    color:var(--muted);

    font-size:11px;

    transition:
        color .2s;
}

.back-btn:active{
    color:var(--text);
}

/* =====================================================
COURSE PAGE
===================================================== */

.course-header-card{
    padding:17px;
    margin-bottom:12px;
}

.course-header-inner{
    display:flex;
    align-items:center;
    gap:13px;
}

.course-header-title{
    color:var(--text);

    font-size:16px;
    font-weight:900;
    line-height:1.8;
}

.course-header-sub{
    margin-top:3px;
    color:var(--muted);
    font-size:9px;
}

/* =====================================================
MODE
===================================================== */

.mode-grid{
    display:grid;
    grid-template-columns:
        1fr 1fr;

    gap:10px;
}

.mode-card{
    min-height:150px;

    padding:
        17px
        11px;

    display:flex;
    flex-direction:column;
    justify-content:center;

    text-align:center;

    border-radius:21px;

    background:var(--card);

    border:
        1px solid
        var(--border);

    box-shadow:var(--shadow);

    cursor:pointer;

    transition:.2s;
}

.mode-card:active{
    transform:scale(.97);
}

.mode-icon{
    width:48px;
    height:48px;

    margin:
        0
        auto
        10px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:15px;

    color:var(--purple);

    background:
        rgba(168,85,247,.10);
}

body.light .mode-icon{
    color:#7e22ce;
    background:
        rgba(126,34,206,.08);
}

.mode-card:nth-child(2) .mode-icon{
    color:var(--cyan);

    background:
        rgba(6,182,212,.10);
}

body.light .mode-card:nth-child(2) .mode-icon{
    color:#0369a1;

    background:
        rgba(3,105,161,.075);
}

.mode-icon svg{
    width:25px;
    height:25px;
}

.mode-card strong{
    display:block;
    color:var(--text);
    font-size:12px;
}

/* =====================================================
QUIZ EXIT BUTTON
===================================================== */

.quiz-exit-btn{
    width:100%;
    height:43px;

    margin:
        8px
        0
        12px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:7px;

    border-radius:15px;

    color:#fca5a5;

    background:
        rgba(239,68,68,.075);

    border:
        1px solid
        rgba(239,68,68,.16);

    font-size:10px;
    font-weight:800;

    transition:
        background .2s,
        border-color .2s,
        transform .15s;
}

.quiz-exit-btn svg{
    width:17px;
    height:17px;
    stroke-width:2.2;
}

.quiz-exit-btn:active{
    transform:scale(.98);

    background:
        rgba(239,68,68,.13);
}

body.light .quiz-exit-btn{
    color:#b91c1c;

    background:
        rgba(220,38,38,.055);

    border-color:
        rgba(220,38,38,.18);
}

/* =====================================================
QUIZ HEADER
===================================================== */

.quiz-header{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin:
        10px
        0;
}

.progress-text{
    color:var(--muted);
    font-size:11px;
}

.timer{
    display:flex;
    align-items:center;
    gap:5px;

    padding:
        7px
        10px;

    border-radius:12px;

    background:
        rgba(239,68,68,.10);

    color:var(--red);

    font-size:11px;
    font-weight:800;
}

.progress-bar{
    height:6px;

    margin-bottom:12px;

    overflow:hidden;

    border-radius:10px;

    background:
        rgba(168,85,247,.10);
}

body.light .progress-bar{
    background:
        rgba(126,34,206,.10);
}

.progress-fill{
    height:100%;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--cyan)
        );

    transition:.3s;
}

/* =====================================================
QUESTION
===================================================== */

.question-card{
    padding:18px;
}

body.light .question-card{
    background:#ffffff;
}

.question-number{
    display:inline-flex;
    align-items:center;

    margin-bottom:11px;

    padding:
        5px
        9px;

    border-radius:10px;

    color:var(--purple);

    background:
        rgba(168,85,247,.10);

    font-size:10px;
    font-weight:900;
}

body.light .question-number{
    color:#6b21a8;

    background:
        rgba(126,34,206,.085);
}

.question-text{
    margin-bottom:18px;

    color:var(--text);

    font-size:14px;
    font-weight:800;

    line-height:2.05;
}

/* =====================================================
OPTIONS
===================================================== */

.option{
    width:100%;
    min-height:52px;

    margin-bottom:9px;

    padding:
        9px
        11px;

    display:flex;
    align-items:center;

    gap:10px;

    text-align:right;

    color:var(--text);

    border:
        1px solid
        var(--border);

    border-radius:16px;

    background:
        var(--bg-secondary);

    box-shadow:none;

    transition:
        background .2s,
        border-color .2s,
        transform .15s;
}

.option:not(.disabled):active{
    transform:scale(.985);
}

.option.selected{
    border-color:
        var(--purple);

    background:
        rgba(168,85,247,.14);

    box-shadow:
        0 0 0 2px
        rgba(168,85,247,.06);
}

.option.correct{
    border-color:
        var(--green)!important;

    background:
        rgba(34,197,94,.14)!important;
}

.option.wrong{
    border-color:
        var(--red)!important;

    background:
        rgba(239,68,68,.14)!important;
}

.option.disabled{
    cursor:default;
}

.option-letter{
    width:30px;
    height:30px;
    min-width:30px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:9px;

    color:var(--purple);

    background:
        rgba(168,85,247,.10);

    font-size:10px;
    font-weight:900;
}

.option.correct .option-letter{
    color:var(--green);

    background:
        rgba(34,197,94,.12);
}

.option.wrong .option-letter{

/* =====================================================
AUTH CARD (name + password login/register)
===================================================== */

.profile-head.auth-mode{
    position:relative;
    overflow:hidden;
    text-align:center;

    background:
        linear-gradient(
            165deg,
            rgba(168,85,247,.14),
            rgba(6,182,212,.05) 55%,
            transparent
        ),
        var(--card);

    border:1px solid rgba(168,85,247,.28);
}

.profile-head.auth-mode::before{
    content:"";
    position:absolute;
    top:-70px;
    right:-50px;
    width:180px;
    height:180px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(168,85,247,.40),transparent 70%);
    filter:blur(6px);
    pointer-events:none;
}

.profile-head.auth-mode::after{
    content:"";
    position:absolute;
    bottom:-60px;
    left:-40px;
    width:160px;
    height:160px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(6,182,212,.28),transparent 70%);
    filter:blur(10px);
    pointer-events:none;
}

.avatar-pulse{
    animation:avatarPulse 2.6s ease-out infinite;
}

@keyframes avatarPulse{
    0%{box-shadow:0 0 0 0 rgba(168,85,247,.45);}
    70%{box-shadow:0 0 0 16px rgba(168,85,247,0);}
    100%{box-shadow:0 0 0 0 rgba(168,85,247,0);}
}

.auth-heading{
    position:relative;
    margin-bottom:16px;
}

.auth-heading strong{
    display:block;
    font-size:15.5px;
    font-weight:800;
    color:var(--text);
}

.auth-heading span{
    display:block;
    margin-top:5px;
    font-size:10.5px;
    color:var(--muted);
    line-height:1.7;
}

.auth-fields{
    position:relative;
    display:flex;
    flex-direction:column;
    gap:11px;
}

.auth-field{
    position:relative;
}

.auth-field svg{
    position:absolute;
    top:50%;
    right:15px;
    transform:translateY(-50%);
    width:16px;
    height:16px;
    color:var(--purple);
    opacity:.9;
    pointer-events:none;
}

.auth-field input{
    width:100%;
    height:50px;
    min-width:0;
    border-radius:15px;
    border:1px solid rgba(168,85,247,.24);
    background:rgba(8,6,18,.5);
    color:var(--text);
    font-size:13px;
    padding:0 44px 0 16px;
    outline:none;
    box-sizing:border-box;
    transition:border-color .2s,box-shadow .2s;
}

body.light .auth-field input{
    background:#ffffff;
    color:#17131f;
    border-color:rgba(126,34,206,.30);
}

body.light .auth-field input::placeholder{
    color:#8a8394;
}

.auth-field input::placeholder{
    color:var(--muted);
    opacity:1;
}

.auth-field input:focus{
    border-color:var(--purple);
    box-shadow:0 0 0 3px rgba(168,85,247,.18);
}

.auth-field .eye-btn{
    position:absolute;
    top:50%;
    left:6px;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:0;
    color:var(--muted);
    cursor:pointer;
}

.auth-field .eye-btn svg{
    position:static;
    transform:none;
    width:15px;
    height:15px;
    color:var(--muted);
    opacity:1;
}

.auth-submit{
    width:100%;
    height:52px;
    margin-top:2px;
    border-radius:16px;
    border:0;
    color:#fff;
    font-size:13.5px;
    font-weight:800;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--purple-dark) 55%,
            var(--cyan) 150%
        );
    box-shadow:0 12px 26px -10px rgba(168,85,247,.70);
    transition:transform .15s,box-shadow .15s;
}

.auth-submit svg{
    width:16px;
    height:16px;
}

.auth-submit:active{
    transform:scale(.97);
    box-shadow:0 6px 16px -8px rgba(168,85,247,.55);
}

.auth-error{
    display:flex;
    align-items:center;
    gap:6px;
    color:#f87171;
    font-size:11px;
    margin:3px 2px 2px;
    text-align:right;
}

.auth-error svg{
    width:13px;
    height:13px;

.auth-hint{

.auth-hint svg{
    width:13px;
    height:13px;

.auth-link{
    margin-top:2px;

    border:0;

    color:var(--text);

    background:var(--card);

    border:
        1px solid
        var(--border);

    border-bottom-right-radius:5px;
}

.msg-empty{
    text-align:center;
    color:var(--muted);
    font-size:11px;
    padding:26px 10px;
    line-height:1.9;
}

.leaderboard-row{
    display:flex;
    align-items:center;
    gap:12px;

    padding:12px 4px;

    border-bottom:
        1px solid
        var(--border);
}

.leaderboard-row:last-child{
    border-bottom:0;
}

.leaderboard-rank{
    width:30px;
    flex-shrink:0;

    text-align:center;

    font-size:15px;
    font-weight:900;

    color:var(--purple);
}

.leaderboard-name{
    flex:1;
    min-width:0;

    font-size:13px;
    font-weight:700;

    color:var(--text);

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.leaderboard-points{
    flex-shrink:0;

    font-size:11px;
    font-weight:800;

    color:var(--purple);

    background:
        rgba(168,85,247,.10);

    padding:4px 10px;

    border-radius:20px;
}

.developer-credit{
    margin-top:9px;

    text-align:center;

    color:var(--muted);

    opacity:.55;

    font-size:8px;

    letter-spacing:.3px;
}

/* =====================================================
BOTTOM NAV
===================================================== */

.bottom-nav{
    position:fixed;
    z-index:60;

    left:50%;
    bottom:10px;

    transform:
        translateX(-50%);

    width:
        calc(100% - 24px);

    max-width:496px;

    height:66px;

    padding:6px;

    display:grid;

    grid-template-columns:
        1fr 1fr;

    border:
        1px solid
        var(--border);

    border-radius:24px;

    background:var(--card);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:var(--shadow);
}

.nav-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:3px;

    border-radius:18px;

    background:none;

    color:var(--muted);

    font-size:9px;

    transition:
        color .2s,
        background .2s;
}

.nav-btn svg{
    width:20px;
}

.nav-btn.active{
    color:var(--purple);

    background:
        rgba(168,85,247,.10);
}

body.light .nav-btn.active{
    color:#6b21a8;

    background:
        rgba(126,34,206,.075);
}

/* =====================================================
TOAST
===================================================== */

.toast{
    position:fixed;
    z-index:10000;

    left:50%;
    bottom:88px;

    transform:
        translateX(-50%)
        translateY(20px);

    width:max-content;
    max-width:90%;

    padding:
        11px
        15px;

    border-radius:14px;

    background:#171020;
    color:#fff;

    border:
        1px solid
        rgba(255,255,255,.10);

    font-size:10px;

    opacity:0;
    pointer-events:none;

    transition:.25s;
}

body.light .toast{
    background:#2b2532;
    color:#fff;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =====================================================
EXIT MODAL
===================================================== */

.modal-overlay{
    position:fixed;
    inset:0;

    z-index:9999;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,0,0,.62);

    backdrop-filter:blur(7px);
    -webkit-backdrop-filter:blur(7px);
}

.exit-modal{
    width:100%;
    max-width:340px;

    padding:
        22px
        18px
        17px;

    border-radius:23px;

    background:var(--card);

    border:
        1px solid
        var(--border);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);

    text-align:center;

    animation:
        exitModalIn
        .2s
        ease;
}

@keyframes exitModalIn{

    from{
        opacity:0;

        transform:
            scale(.94)
            translateY(8px);
    }

    to{
        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }

}

.exit-modal-icon{
    width:48px;
    height:48px;

    margin:
        0
        auto
        12px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:16px;

    color:#ef4444;

    background:
        rgba(239,68,68,.09);

    border:
        1px solid
        rgba(239,68,68,.15);
}

.exit-modal-icon svg{
    width:22px;
    height:22px;
}

.exit-modal h3{
    margin:0;

    font-size:15px;
    font-weight:900;

    color:var(--text);
}

.exit-modal p{
    margin:
        9px
        0
        18px;

    color:var(--muted);

    font-size:10px;

    line-height:2;
}

.exit-modal-actions{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:8px;
}

.exit-modal-actions button{
    height:43px;

    border-radius:13px;

    font-family:inherit;

    font-size:10px;
    font-weight:800;

    cursor:pointer;

    transition:
        transform .15s,
        opacity .2s;
}

.modal-cancel{
    color:var(--text);

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        var(--border);
}

.modal-confirm{
    color:#fff;

    background:#dc2626;

    border:
        1px solid
        #dc2626;
}

.modal-confirm:active,
.modal-cancel:active{
    transform:scale(.97);
}

body.light .modal-overlay{
    background:
        rgba(20,15,30,.35);
}

body.light .exit-modal{
    background:#ffffff;

    border-color:
        rgba(72,55,91,.18);
}

body.light .exit-modal p{

}

body.light .modal-cancel{

SEARCH RESULT INLINE FIXES
===================================================== */

<script>

/* =====================================================
COURSES
===================================================== */

const API_BASE="https://medib4-worker.tmpl8uxxmvxq2d.workers.dev";

let courses=[];

let questionBanks={};

let dataLoaded=false;

let dataLoadError=false;

async function loadAppData(){

    try{

        const [coursesRes,questionsRes]=
            await Promise.all([
                fetch(API_BASE+"/api/courses"),
                fetch(API_BASE+"/api/questions")
            ]);

        if(!coursesRes.ok||!questionsRes.ok){

            throw new Error("bad response");

        }

        courses=await coursesRes.json();

        const allQuestions=
            await questionsRes.json();

        questionBanks={};

        allQuestions.forEach(q=>{

            if(!questionBanks[q.course_id]){

                questionBanks[q.course_id]=[];

            }

            questionBanks[q.course_id].push({

                id:q.id,

                question:q.question,

                options:q.options,

                answer:q.answer,

                explanation:q.explanation,

                gender:q.gender

            });

        });

        dataLoaded=true;

        loadProgress();

    }catch(err){

        dataLoadError=true;

    }

    render();

}

/* =====================================================
STATE
===================================================== */

let currentScreen="home";

let currentCourse=null;

let currentQuestions=[];

const GENDER_SPLIT_COURSES=["islamic_thought_1","family_f"];

let currentGender=null;

let currentQuestionIndex=0;

let selectedAnswers=[];

let quizMode="normal";

let timerInterval=null;

let remainingSeconds=0;

let quizFinished=false;

let historyStack=[];

let educationalScored=[];

let openCommentQuestions=new Set();

/* =====================================================
STORAGE
===================================================== */

const STORAGE={

    profile:"medib4_profile",

    stats:"medib4_stats",

    comments:"medib4_comments",

    theme:"medib4_theme",

    userId:"medib4_user_id",

    userPassword:"medib4_user_password",

    scoredQuestions:
        "medib4_scored_questions"

};

/* =====================================================
USER ID (device identity, used to sync stats/comments)
===================================================== */

function getUserId(){

    let id=
        localStorage.getItem(
            STORAGE.userId
        );

    if(!id){

        id=
            (crypto.randomUUID)
                ?crypto.randomUUID()
                :(
                    "u-"+
                    Date.now()+
                    "-"+
                    Math.random()
                        .toString(16)
                        .slice(2)
                );

        localStorage.setItem(
            STORAGE.userId,
            id
        );

    }

    return id;

}

function syncAnswerToServer(correct,questionId,courseId){

    if(correct&&questionId&&courseId){

        if(!progressCache[courseId]){

            progressCache[courseId]=
                new Set();

        }

        progressCache[courseId].add(
            questionId
        );

    }

    fetch(
        API_BASE+
        "/api/users/"+
        encodeURIComponent(
            getUserId()
        )+
        "/answer",
        {
            method:"POST",
            headers:{
                "Content-Type":
                    "application/json"
            },
            body:JSON.stringify({
                correct,
                question_id:questionId,
                course_id:courseId
            })
        }
    ).catch(()=>{});

}

let progressCache={};

async function loadProgress(){

    try{

        const res=
            await fetch(
                API_BASE+
                "/api/users/"+
                encodeURIComponent(
                    getUserId()
                )+
                "/progress"
            );

        const rows=
            await res.json();

        const map={};

        rows.forEach(r=>{

            if(!map[r.course_id]){

                map[r.course_id]=
                    new Set();

            }

            map[r.course_id].add(
                r.question_id
            );

        });

        progressCache=map;

    }catch{

        progressCache={};

    }

}

function getCourseProgress(courseId){

    const bank=
        questionBanks[courseId]||[];

    const total=
        bank.length;

    if(!total)return null;

    const done=
        progressCache[courseId]

        ?

        progressCache[courseId].size

        :

        0;

    return {
        done:Math.min(done,total),
        total
    };

}

function getUserPassword(){

    return (
        localStorage.getItem(
            STORAGE.userPassword
        )||""
    );

}

function setUserPassword(pw){

    localStorage.setItem(
        STORAGE.userPassword,
        pw
    );

}

/* =====================================================
SCORED QUESTIONS
===================================================== */

function getScoredQuestions(){

    try{

        const data=
            JSON.parse(
                localStorage.getItem(
                    STORAGE.scoredQuestions
                )
            );

        return Array.isArray(data)
            ?data
            :[];

    }catch{

        return [];

    }

}

function saveScoredQuestions(list){

    localStorage.setItem(
        STORAGE.scoredQuestions,
        JSON.stringify(list)
    );

}

function hasQuestionBeenScored(questionId){

    return getScoredQuestions()
        .includes(questionId);

}

function markQuestionAsScored(questionId){

    const scored=
        getScoredQuestions();

    if(!scored.includes(questionId)){

        scored.push(questionId);

        saveScoredQuestions(scored);

    }

}

/* =====================================================
DATE
===================================================== */

function todayKey(){

    const d=new Date();

    return `${d.getFullYear()}-${String(
        d.getMonth()+1
    ).padStart(2,"0")}-${String(
        d.getDate()
    ).padStart(2,"0")}`;

}

/* =====================================================
PROFILE
===================================================== */

function getProfile(){

    try{

        return JSON.parse(
            localStorage.getItem(
                STORAGE.profile
            )
        )||{name:""};

    }catch{

        return {name:""};

    }

}

function saveProfile(profile){

    localStorage.setItem(
        STORAGE.profile,
        JSON.stringify(profile)
    );

}

/* =====================================================
STATS
===================================================== */

function getStats(){

    let stats=null;

    try{

        stats=JSON.parse(
            localStorage.getItem(
                STORAGE.stats
            )
        );

    }catch{

        stats=null;

    }

    if(
        !stats ||
        typeof stats!=="object"
    ){

        stats={
            points:0,
            correct:0,
            wrong:0,
            day:todayKey()
        };

        saveStats(stats);

    }

    if(
        stats.day!==todayKey()
    ){

        stats.correct=0;

        stats.wrong=0;

        stats.day=todayKey();

        saveStats(stats);

    }

    stats.points=
        Number(stats.points)||0;

    stats.correct=
        Number(stats.correct)||0;

    stats.wrong=
        Number(stats.wrong)||0;

    return stats;

}

function saveStats(stats){

    localStorage.setItem(
        STORAGE.stats,
        JSON.stringify(stats)
    );

}

setInterval(()=>{

    getStats();

},60000);

/* =====================================================
HELPERS
===================================================== */

function escapeHTML(text){

    return String(text??"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}

function showToast(message){

    const toast=
        document.getElementById(
            "toast"
        );

    if(!toast)return;

    toast.textContent=message;

    toast.classList.add("show");

    setTimeout(()=>{

        toast.classList.remove(
            "show"
        );

    },2200);

}

function refreshIcons(){

    if(window.lucide){

        lucide.createIcons();

    }

}

/* =====================================================
RANDOM
===================================================== */

function shuffle(array){

    return [...array].sort(
        ()=>Math.random()-.5
    );

}

function getRandomQuestions(courseId){

    let bank=
        questionBanks[courseId]||[];

    if(GENDER_SPLIT_COURSES.includes(courseId)){

        bank=
            bank.filter(
                q=>q.gender===currentGender
            );

    }

    if(!bank.length){

        return [];

    }

    const amount=
        Math.random()<.5
        ?3
        :4;

    return shuffle(bank)
        .slice(
            0,
            Math.min(
                amount,
                bank.length
            )
        )
        .map(q=>{

            const optionObjects=
                q.options.map(
                    (text,index)=>({

                        text,

                        originalIndex:index

                    })
                );

            const shuffledOptions=
                shuffle(
                    optionObjects
                );

            const newAnswer=
                shuffledOptions.findIndex(
                    option=>
                        option.originalIndex===
                        q.answer
                );

            return {

                ...q,

                options:
                    shuffledOptions.map(
                        option=>option.text
                    ),

                answer:newAnswer

            };

        });

}

/* =====================================================

===================================================== */

function setNav(active){

    document
        .querySelectorAll(".nav-btn")
        .forEach(btn=>{

            btn.classList.remove(
                "active"
            );

        });

    if(active==="home"){

        document
            .getElementById(
                "navHome"
            )
            ?.classList
            .add("active");

    }

    if(active==="profile"){

        document
            .getElementById(
                "navProfile"
            )
            ?.classList
            .add("active");

    }

}

function navigate(screen,data=null){

    if(currentScreen!==screen){

        historyStack.push(
            currentScreen
        );

    }

    currentScreen=screen;

    render(data);

}

function goBack(){

    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval=null;

    }

    const previous=
        historyStack.pop();

    if(previous){

        currentScreen=previous;

        render();

    }else{

        goHome();

    }

}

function goHome(){

    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval=null;

    }

    historyStack=[];

    currentScreen="home";

    currentCourse=null;

    const input=
        document.getElementById(
            "searchInput"
        );

    if(input){

        input.value="";

    }

    render();

    setNav("home");

}

function showProfile(){

    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval=null;

    }

    historyStack=[];

    currentScreen="profile";

    render();

    setNav("profile");

}

function startExam(courseId,mode){

    let bank=
        questionBanks[courseId]||[];

    if(GENDER_SPLIT_COURSES.includes(courseId)){

        bank=
            bank.filter(
                q=>q.gender===currentGender
            );

    }

    if(bank.length<3){

        showToast(
            "برای این درس حداقل ۳ سؤال لازم است."
        );

        return;

    }

    currentCourse=courseId;

    quizMode=mode;

    currentQuestions=
        getRandomQuestions(
            courseId
        );

    selectedAnswers=
        new Array(
            currentQuestions.length
        ).fill(null);

    educationalScored=
        new Array(
            currentQuestions.length
        ).fill(false);

    currentQuestionIndex=0;

    quizFinished=false;

    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval=null;

    }

    if(mode==="timed"){

        remainingSeconds=
            8*60;

    }else{

        remainingSeconds=0;

    }

    navigate("quiz");

    if(mode==="timed"){

        timerInterval=
            setInterval(
                updateTimer,
                1000
            );

    }

}

/* =====================================================
TIMER
===================================================== */

function updateTimer(){

    if(currentScreen!=="quiz"){

        clearInterval(
            timerInterval
        );

        timerInterval=null;

        return;

    }

    remainingSeconds--;

    if(remainingSeconds<=0){

        remainingSeconds=0;

        clearInterval(
            timerInterval
        );

        timerInterval=null;

        finishQuiz();

        return;

    }

    const timer=
        document.getElementById(
            "timerValue"
        );

    if(timer){

        timer.textContent=
            formatTime(
                remainingSeconds
            );

    }

}

function formatTime(seconds){

    const min=
        Math.floor(seconds/60)
        .toString()
        .padStart(2,"0");

    const sec=
        (seconds%60)
        .toString()
        .padStart(2,"0");

    return `${min}:${sec}`;

}

/* =====================================================
QUIZ ANSWER STATS
===================================================== */

function getQuizAnswerStats(){

    const total=
        currentQuestions.length;

    let correct=0;

    let wrong=0;

    let unanswered=0;

    currentQuestions.forEach(
        (q,index)=>{

            const selected=
                selectedAnswers[index];

            if(
                selected===null ||
                selected===undefined
            ){

                unanswered++;

            }else if(
                selected===q.answer
            ){

                correct++;

            }else{

                wrong++;

            }

        }
    );

    const percentage=
        number=>{

            if(!total)return 0;

            return Math.round(
                (number/total)*100
            );

        };

    return {

        correct,

        wrong,

        unanswered,

        correctPercent:
            percentage(correct),

        wrongPercent:
            percentage(wrong),

        unansweredPercent:
            percentage(unanswered)

    };

}

/* =====================================================
ANSWERS
===================================================== */

function selectAnswer(index){

    if(quizFinished)return;

    const q=
        currentQuestions[
            currentQuestionIndex
        ];

    if(!q)return;

    if(
        quizMode==="normal" &&
        selectedAnswers[
            currentQuestionIndex
        ]!==null
    ){

        return;

    }

    selectedAnswers[
        currentQuestionIndex
    ]=index;

    if(
        quizMode==="normal" &&
        !educationalScored[
            currentQuestionIndex
        ]
    ){

        const alreadyScored=
            hasQuestionBeenScored(
                q.id
            );

        if(!alreadyScored){

            const stats=getStats();

            if(index===q.answer){

                stats.points+=10;

                stats.correct++;

                syncAnswerToServer(
                    true,
                    q.id,
                    currentCourse
                );

            }else{

                stats.points-=5;

                stats.wrong++;

                syncAnswerToServer(
                    false,
                    q.id,
                    currentCourse
                );

            }

            stats.day=todayKey();

            saveStats(stats);

            markQuestionAsScored(
                q.id
            );

        }

        educationalScored[
            currentQuestionIndex
        ]=true;

    }

    render();

}

function nextQuestion(){

    if(
        currentQuestionIndex<
        currentQuestions.length-1
    ){

        currentQuestionIndex++;

        render();

    }

}

function previousQuestion(){

    if(currentQuestionIndex>0){

        currentQuestionIndex--;

        render();

    }

}

/* =====================================================
COPY
===================================================== */

function copyQuestion(){

    const q=
        currentQuestions[
            currentQuestionIndex
        ];

    if(!q)return;

    const letters=[
        "الف",
        "ب",
        "ج",
        "د"
    ];

    const text=
`${q.question}

${letters[0]}) ${q.options[0]}

${letters[1]}) ${q.options[1]}

${letters[2]}) ${q.options[2]}

${letters[3]}) ${q.options[3]}`;

    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
            .writeText(text)
            .then(()=>{

                showToast(
                    "سوال و ۴ گزینه کپی شد."
                );

            })
            .catch(()=>{

                fallbackCopy(text);

            });

    }else{

        fallbackCopy(text);

    }

}

function fallbackCopy(text){

    const textarea=
        document.createElement(
            "textarea"
        );

    textarea.value=text;

    textarea.style.position="fixed";

    textarea.style.opacity="0";

    document.body.appendChild(
        textarea
    );

    textarea.select();

    try{

        document.execCommand(
            "copy"
        );

        showToast(
            "سوال و ۴ گزینه کپی شد."
        );

    }catch{

        showToast(
            "کپی انجام نشد."
        );

    }

    textarea.remove();

}

/* =====================================================
FINISH
===================================================== */

function finishQuiz(){

    if(quizFinished)return;

    quizFinished=true;

    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval=null;

    }

    let correct=0;

    let wrong=0;

    let unanswered=0;

    const details=[];

    currentQuestions.forEach(
        (q,index)=>{

            const selected=
                selectedAnswers[index];

            if(
                selected===null ||
                selected===undefined
            ){

                unanswered++;

            }else if(
                selected===q.answer
            ){

                correct++;

            }else{

                wrong++;

            }

            details.push({

                question:q.question,

                options:q.options,

                correct:q.answer,

                selected,

                explanation:
                    q.explanation||""

            });

        }
    );

    if(
        quizMode==="timed"
    ){

        const stats=getStats();

        currentQuestions.forEach(
            (q,index)=>{

                const selected=
                    selectedAnswers[index];

                if(
                    selected===null ||
                    selected===undefined
                ){

                    return;

                }

                if(
                    hasQuestionBeenScored(
                        q.id
                    )
                ){

                    return;

                }

                if(
                    selected===q.answer
                ){

                    stats.points+=10;

                    stats.correct++;

                    syncAnswerToServer(
                        true,
                        q.id,
                        currentCourse
                    );

                }else{

                    stats.points-=5;

                    stats.wrong++;

                    syncAnswerToServer(
                        false,
                        q.id,
                        currentCourse
                    );

                }

                markQuestionAsScored(
                    q.id
                );

            }
        );

        stats.day=todayKey();

        saveStats(stats);

    }

    window.quizResult={

        total:
            currentQuestions.length,

        correct,

        wrong,

        unanswered,

        details,

        mode:quizMode

    };

    currentScreen="result";

    render();

}

async function handleForgotPasswordSubmit(){

    const nameInput=
        document.getElementById(
            "forgotNameInput"
        );

    const codeInput=
        document.getElementById(
            "forgotCodeInput"
        );

    const pwInput=
        document.getElementById(
            "forgotNewPasswordInput"
        );

    if(
        !nameInput||
        !codeInput||
        !pwInput
    )return;

    const name=
        nameInput.value.trim();

    const recoveryCode=
        codeInput.value.trim();

    const newPassword=
        pwInput.value;

    if(
        !name||
        !recoveryCode||
        newPassword.length<6
    ){

        forgotFormError=
            "همه فیلدها رو کامل پر کن (رمز جدید حداقل ۶ کاراکتر).";

        render();

        return;

    }

    try{

        const res=
            await fetch(
                API_BASE+
                "/api/forgot-password",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        name,
                        recovery_code:
                            recoveryCode,
                        new_password:
                            newPassword
                    })
                }
            );

        const data=
            await res.json()
                .catch(()=>({}));

        if(!res.ok){

            forgotFormError=
                data.error||
                "بازیابی رمز ناموفق بود.";

            render();

            return;

        }

        localStorage.setItem(
            STORAGE.userId,
            data.user_id
        );

        setUserPassword(
            newPassword
        );

        saveProfile({name});

        showForgotPassword=false;

        forgotFormError="";

        render();

        if(data.recovery_code){

            showRecoveryCodeModal(
                data.recovery_code
            );

        }

    }catch{

        forgotFormError=
            "خطا در ارتباط با سرور.";

        render();

async function handleAuthSubmit(){

    const nameInput=
        document.getElementById(
            "authNameInput"
        );

    const pwInput=
        document.getElementById(
            "authPasswordInput"
        );

    if(!nameInput||!pwInput)return;

    const name=
        nameInput.value.trim();

    const password=
        pwInput.value;

    if(!name||password.length<6){

        authFormError=
            "نام و رمز عبور (حداقل ۶ کاراکتر) رو وارد کن.";

        render();

        return;

    }

    authFormError="";

    try{

        const loginRes=
            await fetch(
                API_BASE+"/api/login",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        name,
                        password
                    })
                }
            );

        if(loginRes.ok){

            const data=
                await loginRes.json();

            localStorage.setItem(
                STORAGE.userId,
                data.user_id
            );

            setUserPassword(
                password
            );

            saveProfile({name});

            showToast(
                "خوش اومدی!"
            );

            render();

            return;

        }

        if(loginRes.status!==404){

            const errData=
                await loginRes.json()
                    .catch(()=>({}));

            authFormError=
                errData.error||
                "ورود ناموفق بود.";

            render();

            return;

        }

        const regRes=
            await fetch(
                API_BASE+"/api/register",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        id:getUserId(),
                        name,
                        password
                    })
                }
            );

        const regData=
            await regRes.json()
                .catch(()=>({}));

        if(!regRes.ok){

            authFormError=
                regData.error||
                "ثبت‌نام ناموفق بود.";

            render();

            return;

        }

        localStorage.setItem(
            STORAGE.userId,
            regData.user_id
        );

        setUserPassword(password);

        saveProfile({name});

        render();

        if(regData.recovery_code){

            showRecoveryCodeModal(
                regData.recovery_code
            );

        }else{

            showToast(
                "حساب ساخته شد."
            );

        }

    }catch{

        authFormError=
            "خطا در ارتباط با سرور.";

        render();

    }

}

    const input=

        );

async function editComment(questionId,commentId){

    const comments=
        commentsCache[questionId]||[];

    const comment=
        comments.find(
            c=>c.id===commentId
        );

    if(!comment)return;

    const newText=
        await appPrompt(
            "متن نظرت رو ویرایش کن:",
            comment.text,
            {
                title:"ویرایش نظر",
                confirmLabel:"ذخیره"
            }
        );

    if(
        newText===null||
        !newText.trim()
    )return;

    try{

        await fetch(
            API_BASE+
            "/api/comments/"+
            commentId,
            {
                method:"PUT",
                headers:{
                    "Content-Type":
                        "application/json"
                },
                body:JSON.stringify({
                    user_id:getUserId(),
                    text:newText.trim()
                })
            }
        );

        delete commentsCache[
            questionId
        ];

        await fetchComments(
            questionId
        );

    }catch{

        showToast(
            "ویرایش نظر ناموفق بود."
        );

    }

}

        await appConfirm(

                title:"حذف نظر",
                confirmLabel:"حذف"
            }
        );

    if(!confirmed)return;

    try{

        await fetch(
            API_BASE+
            "/api/comments/"+
            commentId+
            "?user_id="+
            encodeURIComponent(
                getUserId()
            ),
            {
                method:"DELETE"
            }
        );

        delete commentsCache[
            questionId
        ];

        await fetchComments(
            questionId
        );

    }catch{

        showToast(
            "حذف نظر ناموفق بود."
        );

    }

}

async function addComment(questionId){

    const input=
        document.getElementById(
            `commentInput-${questionId}`
        );

    if(!input)return;

    const text=
        input.value.trim();

    if(!text){

        showToast(

        );

    }

    input.disabled=true;

    try{

        await fetch(
            API_BASE+"/api/comments",

                headers:{

                },

            options.title||

}

function appPrompt(message,defaultValue,options){

    options=options||{};

    return new Promise(resolve=>{

        appDialogResolver=resolve;

        document.getElementById(
            "appDialogTitle"
        ).textContent=
            options.title||
            "ویرایش";

        document.getElementById(
            "appDialogMessage"
        ).textContent=message;

        const wrap=
            document.getElementById(
                "appDialogInputWrap"
            );

        wrap.style.display="flex";

        const input=
            document.getElementById(
                "appDialogInput"
            );

        input.value=
            defaultValue||"";

        document.getElementById(
            "appDialogConfirmBtn"
        ).textContent=
            options.confirmLabel||
            "ذخیره";

        document.getElementById(
            "appDialogModal"
        ).style.display="flex";

        refreshIcons();

        setTimeout(
            ()=>{

                input.focus();

                input.select();

            },
            60
        );

    });

}

function resolveAppDialog(confirmed){

    const inputWrap=
        document.getElementById(
            "appDialogInputWrap"
        );

    const isPrompt=
        inputWrap.style.display!==
        "none";

    let result;

    if(confirmed===null){

        result=
            isPrompt
            ?null
            :false;

    }else if(isPrompt){

        result=
            document.getElementById(
                "appDialogInput"
            ).value;

    }else{

        result=true;

    }

    document.getElementById(
        "appDialogModal"
    ).style.display="none";

    if(appDialogResolver){

        const resolver=
            appDialogResolver;

        appDialogResolver=null;

        resolver(result);

    }

}

            main.innerHTML=
                renderHome();

            setNav("home");

            break;

        case "courses":

            main.innerHTML=
                renderCourses();

            setNav("home");

            break;

        case "genderSelect":

            main.innerHTML=
                renderGenderSelect();

            setNav("home");

            break;

        case "course":

            main.innerHTML=
                renderCourse();

            setNav("home");

            break;

        case "quiz":

            main.innerHTML=
                renderQuiz();

            setNav("home");

            break;

        case "result":

            main.innerHTML=
                renderResult();

            setNav("home");

            break;

        case "profile":

            main.innerHTML=
                renderProfile();

            setNav("profile");

            break;

        case "messages":

            main.innerHTML=
                renderMessages();

            setNav("profile");

            break;

        case "leaderboard":

            main.innerHTML=
                renderLeaderboard();

            setNav("profile");

            break;

        case "search":

            setNav("home");

            break;

        default:

            currentScreen="home";

            main.innerHTML=
                renderHome();

            setNav("home");

    }

    refreshIcons();

}
